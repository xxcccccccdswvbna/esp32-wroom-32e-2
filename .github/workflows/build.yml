name: Build and Release

on:
  push:
    branches: [555]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome
        run: pip install esphome

      # 精准提取 esphome 下的 name，避免匹配 project_name
      - name: Get Device Name
        id: device
        run: |
          DEVICE_NAME=$(grep -m 1 -w 'name:' ble_gateway.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")

          if [ -z "$DEVICE_NAME" ]; then
            echo "ERROR: Failed to extract device name!"
            exit 1
          fi

          echo "Extracted device name: $DEVICE_NAME"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      # 注入构建时间
      - name: Inject Build Timestamp
        id: build_time
        run: |
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          echo "Build time: $BUILD_TIME"

          sed -i \
            "s/build_time: \"Unknown\"/build_time: \"$BUILD_TIME\"/" \
            ble_gateway.yaml

          grep "build_time:" ble_gateway.yaml

          echo "time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      # 编译 ESPHome
      - name: Compile ESPHome Firmware
        run: esphome compile ble_gateway.yaml

      # 生成版本号
      - name: Generate Version Tag
        id: version
        run: |
          VERSION="v$(date -u +'%Y.%m%d.%H%M')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Generated version: $VERSION"

      # 收集固件
      # 不再生成 latest.bin
      - name: Collect Firmware
        run: |
          set -e

          mkdir -p out

          DEVICE_NAME="${{ steps.device.outputs.name }}"
          BRANCH="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"

          BUILD_DIR=".esphome/build/${DEVICE_NAME}/.pioenvs/${DEVICE_NAME}"

          OTA_FILE="${DEVICE_NAME}-${BRANCH}-${VERSION}.bin"
          FACTORY_FILE="${DEVICE_NAME}-${BRANCH}-${VERSION}.factory.bin"

          echo "Device: $DEVICE_NAME"
          echo "Branch: $BRANCH"
          echo "Version: $VERSION"

          # OTA 升级固件
          cp \
            "${BUILD_DIR}/firmware.bin" \
            "out/${OTA_FILE}"

          # 首次烧录固件
          if [ -f "${BUILD_DIR}/firmware.factory.bin" ]; then
            cp \
              "${BUILD_DIR}/firmware.factory.bin" \
              "out/${FACTORY_FILE}"
          else
            echo "WARNING: firmware.factory.bin was not generated."
          fi

          echo
          echo "Generated firmware:"
          ls -lh out/

      # 上传 Actions 构建产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}-${{ steps.version.outputs.version }}
          path: out/
          if-no-files-found: error

      # 创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "🚀 ${{ steps.device.outputs.name }} ${{ github.ref_name }} ${{ steps.version.outputs.version }}"
          body: |
            ## 📦 ESPHome 自动构建

            | 项目 | 信息 |
            |---|---|
            | 设备 | `${{ steps.device.outputs.name }}` |
            | 分支 | `${{ github.ref_name }}` |
            | 版本 | `${{ steps.version.outputs.version }}` |
            | 构建时间 | `${{ steps.build_time.outputs.time }}` |
            | Commit | `${{ github.sha }}` |

            ## 📥 固件说明

            | 固件 | 用途 |
            |---|---|
            | `${{ steps.device.outputs.name }}-${{ github.ref_name }}-${{ steps.version.outputs.version }}.bin` | OTA 在线升级 |
            | `${{ steps.device.outputs.name }}-${{ github.ref_name }}-${{ steps.version.outputs.version }}.factory.bin` | 首次 USB/串口烧录 |

            > 当前 Release 对应版本：
            > `${{ steps.version.outputs.version }}`

            > `.bin`：用于 ESPHome OTA 在线升级  
            > `.factory.bin`：用于首次 USB/串口烧录

          draft: false
          prerelease: false
          generate_release_notes: true

          files: |
            out/*.bin

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
