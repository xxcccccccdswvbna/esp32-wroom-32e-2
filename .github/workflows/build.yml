name: Build and Release

on:
  push:
    branches: [ main, dan ]  # 监听多个分支
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install esphome

      # 🔥 步骤 1：自动从 YAML 中提取设备名称 (例如 yy1)
      - name: Get Device Name
        id: device
        run: |
          # 从 ble_gateway.yaml 中提取 name 字段，并去除空格和引号
          # 如果你的 yaml 文件名不是 ble_gateway.yaml，请修改下面的文件名
          DEVICE_NAME=$(grep -m 1 'name:' ble_gateway.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "Extracted device name: $DEVICE_NAME"
          echo "name=$DEVICE_NAME" >> $GITHUB_OUTPUT

      # 🔥 步骤 2：生成时间戳并注入到 YAML 文件中
      - name: Inject Build Timestamp
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')
          echo "Build time will be: $BUILD_TIME"
          sed -i "s/build_time: \"Unknown\"/build_time: \"$BUILD_TIME\"/" ble_gateway.yaml
          grep "build_time:" ble_gateway.yaml

      # 🔥 步骤 3：编译 (ESPHome 会自动使用提取出的 name)
      - run: esphome compile ble_gateway.yaml

      # 🔥 步骤 4：生成版本标签
      - name: Generate version tag
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION="v$(date +'%Y.%m%d.%H%M')-${BRANCH}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version for branch '$BRANCH': $VERSION"

      # 🔥 步骤 5：收集并重命名固件 (使用动态获取的 DEVICE_NAME)
      - name: Collect and rename firmware
        run: |
          mkdir -p out
          DEVICE_NAME="${{ steps.device.outputs.name }}"
          BRANCH="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          
          echo "Collecting firmware for device: $DEVICE_NAME"
          
          # 复制并重命名，路径中全部使用 $DEVICE_NAME 变量
          cp ".esphome/build/${DEVICE_NAME}/.pioenvs/${DEVICE_NAME}/firmware.bin" "out/${DEVICE_NAME}-${BRANCH}-${VERSION}.bin"
          cp ".esphome/build/${DEVICE_NAME}/.pioenvs/${DEVICE_NAME}/firmware.factory.bin" "out/${DEVICE_NAME}-${BRANCH}-${VERSION}.factory.bin" 2>/dev/null || true
          
          # 保留 latest 版本
          cp ".esphome/build/${DEVICE_NAME}/.pioenvs/${DEVICE_NAME}/firmware.bin" "out/${DEVICE_NAME}-${BRANCH}-latest.bin"
          cp ".esphome/build/${DEVICE_NAME}/.pioenvs/${DEVICE_NAME}/firmware.factory.bin" "out/${DEVICE_NAME}-${BRANCH}-latest.factory.bin" 2>/dev/null || true
          
          echo "Generated firmware files:"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: out/

      # 🔥 步骤 6：自动创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "🚀 Build ${{ steps.version.outputs.version }}"
          body: |
            ## 📦 自动构建完成
            
            - **设备名称**: `${{ steps.device.outputs.name }}`
            - **分支**: `${{ github.ref_name }}`
            - **版本**: `${{ steps.version.outputs.version }}`
            - **编译时间**: ${{ github.event.head_commit.timestamp }}
            - **Commit**: `${{ github.sha }}`
            
            ### 📥 固件下载
            
            | 文件名 | 用途说明 |
            | :--- | :--- |
            | `${{ steps.device.outputs.name }}-${{ github.ref_name }}-latest.bin` | **推荐**：该分支最新的 OTA 升级固件 |
            | `${{ steps.device.outputs.name }}-${{ github.ref_name }}-latest.factory.bin` | **推荐**：该分支最新的首次 USB 烧录固件 |
            
            > 💡 **提示**：请根据你当前使用的分支 (`main` 或 `dan`) 选择对应的固件进行 OTA 升级。
          draft: false
          prerelease: false
          files: |
            out/${{ steps.device.outputs.name }}-${{ github.ref_name }}-${{ steps.version.outputs.version }}.bin
            out/${{ steps.device.outputs.name }}-${{ github.ref_name }}-${{ steps.version.outputs.version }}.factory.bin
            out/${{ steps.device.outputs.name }}-${{ github.ref_name }}-latest.bin
            out/${{ steps.device.outputs.name }}-${{ github.ref_name }}-latest.factory.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
