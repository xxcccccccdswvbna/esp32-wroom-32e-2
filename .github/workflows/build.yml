name: Build and Release

on:
  push:
    branches: [ main, dan ]  # 🔥 监听两个分支的推送
  workflow_dispatch:

# 🔥 修复 403 错误：显式授予写入仓库内容的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install esphome

      # 🔥 生成时间戳并注入到 YAML 文件中
      - name: Inject Build Timestamp
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')
          echo "Build time will be: $BUILD_TIME"
          sed -i "s/build_time: \"Unknown\"/build_time: \"$BUILD_TIME\"/" ble_gateway.yaml
          grep "build_time:" ble_gateway.yaml

      - run: esphome compile ble_gateway.yaml

      # 🔥 生成版本标签（格式：v2026.0730.2337-main 或 v2026.0730.2337-dan）
      - name: Generate version tag
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION="v$(date +'%Y.%m%d.%H%M')-${BRANCH}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version for branch '$BRANCH': $VERSION"

      # 🔥 收集并重命名固件（文件名中强制包含分支名）
      - name: Collect and rename firmware
        run: |
          mkdir -p out
          BRANCH="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          
          # 带版本号和分支名的固件
          cp .esphome/build/ble-gw/.pioenvs/ble-gw/firmware.bin out/ble-gw-${BRANCH}-${VERSION}.bin
          cp .esphome/build/ble-gw/.pioenvs/ble-gw/firmware.factory.bin out/ble-gw-${BRANCH}-${VERSION}.factory.bin 2>/dev/null || true
          
          # 带分支名的 latest 固件（方便直接下载该分支最新版）
          cp .esphome/build/ble-gw/.pioenvs/ble-gw/firmware.bin out/ble-gw-${BRANCH}-latest.bin
          cp .esphome/build/ble-gw/.pioenvs/ble-gw/firmware.factory.bin out/ble-gw-${BRANCH}-latest.factory.bin 2>/dev/null || true
          
          echo "Generated firmware files:"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: out/

      # 🔥 自动创建 GitHub Release (标题和描述中明确标注分支)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "🚀 Build ${{ steps.version.outputs.version }}"
          body: |
            ## 📦 自动构建完成
            
            - **分支**: `${{ github.ref_name }}`
            - **版本**: `${{ steps.version.outputs.version }}`
            - **编译时间**: ${{ github.event.head_commit.timestamp }}
            - **Commit**: `${{ github.sha }}`
            
            ### 📥 固件下载
            
            | 文件名 | 用途说明 |
            | :--- | :--- |
            | `ble-gw-${{ github.ref_name }}-latest.bin` | **推荐**：该分支最新的 OTA 升级固件 |
            | `ble-gw-${{ github.ref_name }}-latest.factory.bin` | **推荐**：该分支最新的首次 USB 烧录固件 |
            | `ble-gw-${{ github.ref_name }}-${{ steps.version.outputs.version }}.bin` | 带版本号的 OTA 固件 (归档用) |
            
            > 💡 **提示**：请根据你当前使用的分支 (`main` 或 `dan`) 选择对应的固件进行 OTA 升级。
          draft: false
          prerelease: false
          files: |
            out/ble-gw-${{ github.ref_name }}-${{ steps.version.outputs.version }}.bin
            out/ble-gw-${{ github.ref_name }}-${{ steps.version.outputs.version }}.factory.bin
            out/ble-gw-${{ github.ref_name }}-latest.bin
            out/ble-gw-${{ github.ref_name }}-latest.factory.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
