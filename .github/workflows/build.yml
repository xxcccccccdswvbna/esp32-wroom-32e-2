name: Build and Release
on:
  push:
    branches: [esp32-1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:name: Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install esphome pyyaml jinja2
      - name: Generate ESPHome config
        run: python tools/generate.py
      - name: Get Device Name
        id: device
        run: |
          DEVICE_NAME=$(grep -m1 -w 'name:' ble_gateway.yaml | awk '{print $2}')
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
      - name: Inject build time
        run: |
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          sed -i "s/build_time: .*/build_time: \"$BUILD_TIME\"/" ble_gateway.yaml || true
      - name: Compile
        run: esphome compile ble_gateway.yaml
      - name: Version
        id: version
        run: |
          VERSION="v$(date -u +'%Y.%m%d.%H%M')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect firmware
        run: |
          mkdir -p out
          DEV=${{ steps.device.outputs.name }}
          BR=${{ github.ref_name }}
          VER=${{ steps.version.outputs.version }}
          BDIR=".esphome/build/${DEV}/.pioenvs/${DEV}"
          cp "${BDIR}/firmware.bin" "out/${DEV}-${BR}-${VER}.bin"
          [ -f "${BDIR}/firmware.factory.bin" ] && cp "${BDIR}/firmware.factory.bin" "out/${DEV}-${BR}-${VER}.factory.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}-${{ steps.version.outputs.version }}
          path: out/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.device.outputs.name }} ${{ steps.version.outputs.version }}"
          body: "Auto build from ${{ github.ref_name }}"
          files: out/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
