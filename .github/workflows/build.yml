name: Build and Release

on:
  push:
    branches: [ dan ]
  workflow_dispatch:

# 🔥 修复 403 错误：显式授予写入仓库内容的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install esphome

      # 🔥 生成时间戳并注入到 YAML 文件中
      - name: Inject Build Timestamp
        run: |
          # 生成格式化的时间，例如: 2026-07-30 23:37:00
          BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')
          echo "Build time will be: $BUILD_TIME"
          
          # 使用 sed 替换 YAML 中的占位符
          sed -i "s/build_time: \"Unknown\"/build_time: \"$BUILD_TIME\"/" ble_gateway.yaml
          
          # 验证替换是否成功
          grep "build_time:" ble_gateway.yaml

      - run: esphome compile ble_gateway.yaml

      # 🔥 生成版本标签（格式：v2026.0730.2337）
      - name: Generate version tag
        id: version
        run: |
          VERSION="v$(date +'%Y.%m%d.%H%M')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      # 🔥 收集并重命名固件
      - name: Collect and rename firmware
        run: |
          mkdir -p out
          VERSION="${{ steps.version.outputs.version }}"
          
          cp .esphome/build/ble-gw/.pioenvs/ble-gw/firmware.bin out/ble-gw-${VERSION}.bin
          cp .esphome/build/ble-gw/.pioenvs/ble-gw/firmware.factory.bin out/ble-gw-${VERSION}.factory.bin 2>/dev/null || true
          
          # 保留 latest 版本
          cp .esphome/build/ble-gw/.pioenvs/ble-gw/firmware.bin out/ble-gw-latest.bin
          cp .esphome/build/ble-gw/.pioenvs/ble-gw/firmware.factory.bin out/ble-gw-latest.factory.bin 2>/dev/null || true
          
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: out/

      # 🔥 自动创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Build ${{ steps.version.outputs.version }}"
          body: |
            ## 🚀 自动构建
            
            **版本**: `${{ steps.version.outputs.version }}`
            **编译时间**: ${{ github.event.head_commit.timestamp }}
            **Commit**: `${{ github.sha }}`
            
            ### 📦 固件文件
            - `ble-gw-${{ steps.version.outputs.version }}.bin` - OTA 升级固件
            - `ble-gw-latest.bin` - 最新版本（始终指向最新构建）
          draft: false
          prerelease: false
          files: |
            out/ble-gw-${{ steps.version.outputs.version }}.bin
            out/ble-gw-${{ steps.version.outputs.version }}.factory.bin
            out/ble-gw-latest.bin
            out/ble-gw-latest.factory.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
