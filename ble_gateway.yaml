# ===================== 状态监听 → 上报巴法云 =====================
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            auto datas = x.get_manufacturer_datas();
            for (auto &data : datas) {
                auto &raw = data.data;
                if (raw.size() < 20) continue;

                // 餐厅 (MAC: 00:00:70:27:80:48)
                uint8_t ct_mac[6] = {0x48, 0x80, 0x27, 0x70, 0x00, 0x00};
                for (int i = 2; i <= (int)raw.size() - 6; i++) {
                    if (memcmp(&raw[i], ct_mac, 6) == 0) {
                        bool on = (raw[i + 7] == 0x01);
                        id(bemfa).publish("ctlight002/get", on ? "on" : "off");
                        break;
                    }
                }

                // 次卧 (MAC: 00:00:70:2d:cf:f0)
                uint8_t cw_mac[6] = {0xF0, 0xCF, 0x2D, 0x70, 0x00, 0x00};
                for (int i = 2; i <= (int)raw.size() - 6; i++) {
                    if (memcmp(&raw[i], cw_mac, 6) == 0) {
                        bool on = (raw[i + 7] == 0x01);
                        id(bemfa).publish("cwlight002/get", on ? "on" : "off");
                        break;
                    }
                }
            }
