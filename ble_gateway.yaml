# ===================== 项目配置 =====================
substitutions:
  project_name: "BLE Gateway"
  # 🔥 占位符：编译时会被 GitHub Actions 自动替换为真实时间
  build_time: "Unknown" 

esphome:
  name: yy1
  friendly_name: "${project_name}"
  comment: "${project_name} - Build: ${build_time}"

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: y

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: "CC"
  password: "chen1122"
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "BLE-GW Fallback"
    password: "12345678"

captive_portal:
web_server:
  port: 80
ota:
  - platform: esphome

api:
  reboot_timeout: 0s

external_components:
  - source:
      type: local
      path: components

ble_tx:
  id: tx

esp32_ble:
  io_capability: none
  enable_on_boot: true
bluetooth_proxy:
  active: true
  cache_services: true

