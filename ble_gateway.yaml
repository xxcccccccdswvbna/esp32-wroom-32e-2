# ============================================================
#  BLE 网关 - 巴法云直连版 (修正版)
#  巴法云后缀: 002=灯泡  003=风扇  006=开关
# ============================================================

esphome:
  name: ble-gw
  friendly_name: "BLE Gateway"

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: y

logger:
  baud_rate: 115200
  level: DEBUG

wifi:
  ssid: "CC"
  password: "chen1122"
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "BLE-GW"
    password: "12345678"

captive_portal:
web_server:
ota:
  - platform: esphome

api:
  reboot_timeout: 0s

external_components:
  - source:
      type: local
      path: components

# ===================== BLE 发射器 =====================
ble_tx:
  id: tx

# ===================== 蓝牙代理 =====================
esp32_ble:
  io_capability: none
  enable_on_boot: true
bluetooth_proxy:
  active: true
  cache_services: true

