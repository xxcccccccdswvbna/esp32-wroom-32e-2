# ===================== 系统状态传感器 =====================
sensor:
  - platform: template
    name: "餐厅灯亮度 Dining"      # 🔥 加上英文
    id: ct_light_brt
    unit_of_measurement: "%"
  - platform: template
    name: "餐厅灯色温 Dining"      # 🔥 加上英文
    id: ct_light_ct
    unit_of_measurement: "K"
  - platform: template
    name: "餐厅风扇档位 Dining"    # 🔥 加上英文
    id: ct_fan_spd
  - platform: template
    name: "次卧灯亮度 Bedroom"     # 🔥 加上英文
    id: cw_light_brt
    unit_of_measurement: "%"
  - platform: template
    name: "次卧灯色温 Bedroom"     # 🔥 加上英文
    id: cw_light_ct
    unit_of_measurement: "K"
  - platform: template
    name: "次卧风扇档位 Bedroom"   # 🔥 加上英文
    id: cw_fan_spd
  - platform: uptime
    name: "Gateway Uptime"
    id: gateway_uptime
    update_interval: 60s

  - platform: internal_temperature
    name: "ESP32 Chip Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal dBm"
    id: wifi_signal_db
    update_interval: 60s

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:wifi-strength-4

binary_sensor:
  - platform: status
    name: "Gateway Status"
    device_class: connectivity
  - platform: template
    name: "餐厅灯状态 Dining"      # 🔥 加上英文，防止 ID 变成 _____
    id: ct_light_state
    device_class: light
  - platform: template
    name: "次卧灯状态 Bedroom"     # 🔥 加上英文
    id: cw_light_state
    device_class: light
  - platform: template
    name: "餐厅风扇状态 Dining"    # 🔥 加上英文
    id: ct_fan_state
    device_class: running
  - platform: template
    name: "次卧风扇状态 Bedroom"   # 🔥 加上英文
    id: cw_fan_state
    device_class: running
text_sensor:
  # 🔥 显示注入的真实编译时间
  - platform: template
    name: "Build Timestamp"
    lambda: |-
      return {"${build_time}"};
    icon: mdi:calendar-clock
    update_interval: 3600s

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true

  - platform: wifi_info
    ip_address:
      name: "ESP IP Address"
    ssid:
      name: "ESP Connected SSID"
    bssid:
      name: "ESP Connected BSSID"
    mac_address:
      name: "ESP MAC Address"
