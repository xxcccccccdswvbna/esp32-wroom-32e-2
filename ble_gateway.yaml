# ===================== 项目配置 =====================
substitutions:
  project_name: "byy1"
  build_time: "Unknown"

esphome:
  name: ble-2
  friendly_name: "${project_name}"
  comment: "${project_name} - Build: ${build_time}"
  includes:
    - midea_ble_controller.h

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: y

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: "CC"
  password: "chen1122"
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "BLE-GW Fallback"
    password: "12345678"

captive_portal:
web_server:
  port: 80
ota:
  - platform: esphome
api:
  reboot_timeout: 0s
  services:
    - service: send_raw_hex
      variables:
        hex_data: string
      then:
        - lambda: 'id(tx).send_hex(hex_data);'

external_components:
  - source:
      type: local
      path: components

ble_tx:
  id: tx

esp32_ble:
  io_capability: none
  enable_on_boot: true

bluetooth_proxy:
  active: true
  cache_services: true

# ===================== 巴法云 MQTT =====================
mqtt:
  id: bemfa
  broker: bemfa.com
  port: 9501
  username: "97109945d7e24559b3e4ca7a1f8ef160"
  password: "97109945d7e24559b3e4ca7a1f8ef160"
  client_id: "97109945d7e24559b3e4ca7a1f8ef160"
  keepalive: 30s
  discovery: false
  birth_message:
  will_message:
  on_message:
    - topic: "ctlight002"
      then:
        - lambda: |-
            if(x == "on" || x == "off") {
              id(tx).send_hex(midea_light_toggle("488027700000"));
            } else if(x.find("on#") == 0) {
              std::string rest = x.substr(3);
              int brt = std::stoi(rest.substr(0, rest.find('#')));
              int ct = std::stoi(rest.substr(rest.find('#') + 1));
              id(tx).send_hex(midea_light_brightness_color("488027700000", brt, ct));
            }

    - topic: "ctfan003"
      then:
        - lambda: |-
            if(x == "on" || x == "off") {
              id(tx).send_hex(midea_fan_toggle("488027700000"));
            } else if(x.find("on#") == 0) {
              int s = std::stoi(x.substr(3));
              id(tx).send_hex(midea_fan_speed("488027700000", s));
            }

    - topic: "cwlight002"
      then:
        - lambda: |-
            if(x == "on" || x == "off") {
              id(tx).send_hex(midea_light_toggle("F0CF2D700000"));
            } else if(x.find("on#") == 0) {
              std::string rest = x.substr(3);
              int brt = std::stoi(rest.substr(0, rest.find('#')));
              int ct = std::stoi(rest.substr(rest.find('#') + 1));
              id(tx).send_hex(midea_light_brightness_color("F0CF2D700000", brt, ct));
            }

    - topic: "cwfan003"
      then:
        - lambda: |-
            if(x == "on" || x == "off") {
              id(tx).send_hex(midea_fan_toggle("F0CF2D700000"));
            } else if(x.find("on#") == 0) {
              int s = std::stoi(x.substr(3));
              id(tx).send_hex(midea_fan_speed("F0CF2D700000", s));
            }

# ===================== BLE 扫描与状态上报 =====================
esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            auto datas = x.get_manufacturer_datas();
            for (auto &data : datas) {
              auto &raw = data.data;
              if (raw.size() < 20) continue;

              uint8_t ct_mac[6] = {0x48, 0x80, 0x27, 0x70, 0x00, 0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], ct_mac, 6) == 0) {
                  bool light_on = (raw[i+7] == 0x01);
                  int brt = (int)(raw[i+12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500-2700) * (int)(raw[i+13] / 255.0f * 100.0f) / 100;
                  uint8_t fs = raw[i+16];
                  bool fan_run = (fs & 0x01) != 0;
                  int fan_spd = fan_run ? (raw[i+17] + 1) : 0;

                  static bool ll=false, lfr=false; static int lb=-1, lc=-1, lfs=-1;
                  static uint32_t lr=0, lch=0; static uint8_t rc=0;
                  bool ch=(light_on!=ll)||(brt!=lb)||(ct_k!=lc)||(fan_run!=lfr)||(fan_spd!=lfs);
                  if(ch){lch=millis();rc=0;ll=light_on;lb=brt;lc=ct_k;lfr=fan_run;lfs=fan_spd;}
                  bool hb=(millis()-lr>60000);
                  bool rt=(millis()-lch<10000)&&(rc<3)&&(millis()-lr>3000);
                  if(ch||hb||rt){
                    if(rt)rc++;else rc=0; lr=millis();
                    if(light_on) id(bemfa).publish("ctlight002/up","on#"+std::to_string(brt)+"#"+std::to_string(ct_k));
                    else id(bemfa).publish("ctlight002/up","off");
                    if(fan_run) id(bemfa).publish("ctfan003/up","on#"+std::to_string(fan_spd));
                    else id(bemfa).publish("ctfan003/up","off");
                    id(ct_light_on).publish_state(light_on);
                    id(ct_brt).publish_state(brt);
                    id(ct_ct).publish_state(ct_k);
                    id(ct_fan_on).publish_state(fan_run);
                    id(ct_spd).publish_state(fan_spd);
                  }
                  break;
                }
              }

              uint8_t cw_mac[6] = {0xF0, 0xCF, 0x2D, 0x70, 0x00, 0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], cw_mac, 6) == 0) {
                  bool light_on = (raw[i+7] == 0x01);
                  int brt = (int)(raw[i+12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500-2700) * (int)(raw[i+13] / 255.0f * 100.0f) / 100;
                  uint8_t fs = raw[i+16];
                  bool fan_run = (fs & 0x01) != 0;
                  int fan_spd = fan_run ? (raw[i+17] + 1) : 0;

                  static bool ll=false, lfr=false; static int lb=-1, lc=-1, lfs=-1;
                  static uint32_t lr=0, lch=0; static uint8_t rc=0;
                  bool ch=(light_on!=ll)||(brt!=lb)||(ct_k!=lc)||(fan_run!=lfr)||(fan_spd!=lfs);
                  if(ch){lch=millis();rc=0;ll=light_on;lb=brt;lc=ct_k;lfr=fan_run;lfs=fan_spd;}
                  bool hb=(millis()-lr>60000);
                  bool rt=(millis()-lch<10000)&&(rc<3)&&(millis()-lr>3000);
                  if(ch||hb||rt){
                    if(rt)rc++;else rc=0; lr=millis();
                    if(light_on) id(bemfa).publish("cwlight002/up","on#"+std::to_string(brt)+"#"+std::to_string(ct_k));
                    else id(bemfa).publish("cwlight002/up","off");
                    if(fan_run) id(bemfa).publish("cwfan003/up","on#"+std::to_string(fan_spd));
                    else id(bemfa).publish("cwfan003/up","off");
                    id(cw_light_on).publish_state(light_on);
                    id(cw_brt).publish_state(brt);
                    id(cw_ct).publish_state(ct_k);
                    id(cw_fan_on).publish_state(fan_run);
                    id(cw_spd).publish_state(fan_spd);
                  }
                  break;
                }
              }
            }

# ===================== 开关 =====================
switch:
  - platform: template
    name: "Dining Light"
    id: ct_light_sw
    icon: mdi:ceiling-light
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(tx).send_hex(midea_light_toggle("488027700000"));'
    turn_off_action:
      - lambda: 'id(tx).send_hex(midea_light_toggle("488027700000"));'
    lambda: 'return id(ct_light_on).state;'

  - platform: template
    name: "Dining Fan"
    id: ct_fan_sw
    icon: mdi:fan
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(tx).send_hex(midea_fan_toggle("488027700000"));'
    turn_off_action:
      - lambda: 'id(tx).send_hex(midea_fan_toggle("488027700000"));'
    lambda: 'return id(ct_fan_on).state;'

  - platform: template
    name: "Bedroom Light"
    id: cw_light_sw
    icon: mdi:ceiling-light
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(tx).send_hex(midea_light_toggle("F0CF2D700000"));'
    turn_off_action:
      - lambda: 'id(tx).send_hex(midea_light_toggle("F0CF2D700000"));'
    lambda: 'return id(cw_light_on).state;'

  - platform: template
    name: "Bedroom Fan"
    id: cw_fan_sw
    icon: mdi:fan
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(tx).send_hex(midea_fan_toggle("F0CF2D700000"));'
    turn_off_action:
      - lambda: 'id(tx).send_hex(midea_fan_toggle("F0CF2D700000"));'
    lambda: 'return id(cw_fan_on).state;'

# ===================== Number 滑块 =====================
number:
  - platform: template
    name: "Dining Brightness"
    id: ct_brt_n
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-percent
    set_action:
      - lambda: 'id(tx).send_hex(midea_light_brightness("488027700000", (int)x));'

  - platform: template
    name: "Dining ColorTemp"
    id: ct_ct_n
    min_value: 2700
    max_value: 6500
    step: 100
    unit_of_measurement: "K"
    icon: mdi:thermometer
    set_action:
      - lambda: 'id(tx).send_hex(midea_light_color_temp("488027700000", (int)x));'

  - platform: template
    name: "Dining Fan Speed"
    id: ct_spd_n
    min_value: 1
    max_value: 6
    step: 1
    icon: mdi:fan-speed-1
    set_action:
      - lambda: 'id(tx).send_hex(midea_fan_speed("488027700000", (int)x));'

  - platform: template
    name: "Bedroom Brightness"
    id: cw_brt_n
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-percent
    set_action:
      - lambda: 'id(tx).send_hex(midea_light_brightness("F0CF2D700000", (int)x));'

  - platform: template
    name: "Bedroom ColorTemp"
    id: cw_ct_n
    min_value: 2700
    max_value: 6500
    step: 100
