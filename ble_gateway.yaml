# ===================== 巴法云 MQTT =====================
mqtt:
  id: bemfa
  broker: bemfa.com
  port: 9501
  username: "97109945d7e24559b3e4ca7a1f8ef160"
  password: "97109945d7e24559b3e4ca7a1f8ef160"
  client_id: "97109945d7e24559b3e4ca7a1f8ef160"
  keepalive: 30s
  discovery: false
  birth_message:
  will_message:
  on_message:
    - topic: "ctlight002"
      then:
        - lambda: |-
            MideaController ctrl("488027700000");
            if (x == "on") {
              id(tx).send_hex(ctrl.make_command({0x06}, 2, 4));
            } else if (x == "off") {
              id(tx).send_hex(ctrl.make_command({0x06}, 2, 4));
            } else if (x.find("on#") == 0) {
              std::string rest = x.substr(3);
              int brt = atoi(rest.substr(0, rest.find('#')).c_str());
              int ct = atoi(rest.substr(rest.find('#') + 1).c_str());
              uint8_t br = round(brt * 255.0 / 100.0);
              uint8_t cv = round((ct - 2700.0) * 255.0 / 3800.0);
              id(tx).send_hex(ctrl.make_command({0x5B, br, cv}, 2, 4));
            }
    - topic: "ctfan003"
      then:
        - lambda: |-
            MideaController ctrl("488027700000");
            if (x == "on") {
              id(tx).send_hex(ctrl.make_command({0x09}, 8, 15));
            } else if (x == "off") {
              id(tx).send_hex(ctrl.make_command({0x09}, 8, 15));
            } else if (x.find("on#") == 0) {
              int s = atoi(x.substr(3).c_str());
              id(tx).send_hex(ctrl.make_fan_speed_command(s));
            }
    - topic: "cwlight002"
      then:
        - lambda: |-
            MideaController ctrl("F0CF2D700000");
            if (x == "on") {
              id(tx).send_hex(ctrl.make_command({0x06}, 2, 4));
            } else if (x == "off") {
              id(tx).send_hex(ctrl.make_command({0x06}, 2, 4));
            } else if (x.find("on#") == 0) {
              std::string rest = x.substr(3);
              int brt = atoi(rest.substr(0, rest.find('#')).c_str());
              int ct = atoi(rest.substr(rest.find('#') + 1).c_str());
              uint8_t br = round(brt * 255.0 / 100.0);
              uint8_t cv = round((ct - 2700.0) * 255.0 / 3800.0);
              id(tx).send_hex(ctrl.make_command({0x5B, br, cv}, 2, 4));
            }
    - topic: "cwfan003"
      then:
        - lambda: |-
            MideaController ctrl("F0CF2D700000");
            if (x == "on") {
              id(tx).send_hex(ctrl.make_command({0x09}, 8, 15));
            } else if (x == "off") {
              id(tx).send_hex(ctrl.make_command({0x09}, 8, 15));
            } else if (x.find("on#") == 0) {
              int s = atoi(x.substr(3).c_str());
              id(tx).send_hex(ctrl.make_fan_speed_command(s));
            }

# ===================== BLE 状态扫描 =====================
esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            for (auto &data : x.get_manufacturer_datas()) {
              auto &raw = data.data;
              if (raw.size() < 19) continue;
              if (raw[0] == 0x81 && raw[1] == 0x53 && raw[2] == 0x01) {
                char mac_str[13];
                sprintf(mac_str, "%02X%02X%02X%02X%02X%02X",
                        raw[8], raw[7], raw[6], raw[5], raw[4], raw[3]);
                std::string mac = mac_str;
                uint8_t mode     = raw[11];
                uint8_t bri      = raw[14];
                uint8_t ct       = raw[15];
                uint8_t fan_gear = raw[18];
                bool light_on = (mode & 0x01);
                bool fan_on   = !(mode == 0x10 || mode == 0x11);
                int fan_speed = fan_on ? (fan_gear + 1) : 0;
                int brt_pct   = (int)round(bri * 100.0 / 255.0);
                int ct_kelvin = 2700 + (int)round(ct * 3800.0 / 255.0);
                if (mac == "488027700000") {
                  id(ct_light).publish_state(light_on);
                  id(ct_light).publish_brightness(brt_pct);
                  id(ct_light).publish_color_temperature(ct_kelvin);
                  id(ct_fan).publish_state(fan_on);
                  id(ct_fan).publish_speed(fan_speed);
                } else if (mac == "F0CF2D700000") {
                  id(cw_light).publish_state(light_on);
                  id(cw_light).publish_brightness(brt_pct);
                  id(cw_light).publish_color_temperature(ct_kelvin);
                  id(cw_fan).publish_state(fan_on);
                  id(cw_fan).publish_speed(fan_speed);
                }
              }
            }

# ===================== 原生 Light 组件（新版语法） =====================
light:
  - platform: template
    name: "Dining Light"
    id: ct_light
    icon: mdi:ceiling-light
    effects:
      - name: "None"
    on_state:
      then:
        - lambda: |-
            if (id(ct_light).current_values.is_on()) {
              MideaController ctrl("488027700000");
              id(tx).send_hex(ctrl.make_command({0x06}, 2, 4));
            } else {
              MideaController ctrl("488027700000");
              id(tx).send_hex(ctrl.make_command({0x06}, 2, 4));
            }
    on_brightness:
      then:
        - lambda: |-
            MideaController ctrl("488027700000");
            uint8_t br = round(x * 255.0);
            id(tx).send_hex(ctrl.make_command({0x51, br}, 2, 4));
    on_color_temperature:
      then:
        - lambda: |-
            MideaController ctrl("488027700000");
            int kelvin = (int)(1000000.0 / x);
            uint8_t cv = round((kelvin - 2700.0) * 255.0 / 3800.0);
            id(tx).send_hex(ctrl.make_command({0x55, cv}, 2, 4));
    supports_brightness: true
    supports_color_temperature: true
    min_mireds: 153
    max_mireds: 370

  - platform: template
    name: "Bedroom Light"
    id: cw_light
    icon: mdi:ceiling-light
    effects:
      - name: "None"
    on_state:
      then:
        - lambda: |-
            if (id(cw_light).current_values.is_on()) {
              MideaController ctrl("F0CF2D700000");
              id(tx).send_hex(ctrl.make_command({0x06}, 2, 4));
            } else {
              MideaController ctrl("F0CF2D700000");
              id(tx).send_hex(ctrl.make_command({0x06}, 2, 4));
            }
    on_brightness:
      then:
        - lambda: |-
            MideaController ctrl("F0CF2D700000");
            uint8_t br = round(x * 255.0);
            id(tx).send_hex(ctrl.make_command({0x51, br}, 2, 4));
    on_color_temperature:
      then:
        - lambda: |-
            MideaController ctrl("F0CF2D700000");
            int kelvin = (int)(1000000.0 / x);
            uint8_t cv = round((kelvin - 2700.0) * 255.0 / 3800.0);
            id(tx).send_hex(ctrl.make_command({0x55, cv}, 2, 4));
    supports_brightness: true
    supports_color_temperature: true
    min_mireds: 153
    max_mireds: 370

# ===================== 原生 Fan 组件 =====================
fan:
