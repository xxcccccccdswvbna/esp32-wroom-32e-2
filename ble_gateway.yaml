# ===================== BLE 扫描与状态上报 =====================
esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            auto datas = x.get_manufacturer_datas();
            for (auto &data : datas) {
              auto &raw = data.data;
              if (raw.size() < 20) continue;

              // ===== Dining 餐厅设备 (48:80:27:70:00:00) =====
              uint8_t ct_mac[6] = {0x48, 0x80, 0x27, 0x70, 0x00, 0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], ct_mac, 6) == 0) {
                  bool light_on = (raw[i + 7] == 0x01);
                  int brt = (int)(raw[i + 12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500 - 2700) * (int)(raw[i + 13] / 255.0f * 100.0f) / 100;
                  uint8_t fan_state = raw[i + 16];
                  bool fan_run = (fan_state & 0x01) != 0; 
                  int fan_spd = fan_run ? (raw[i + 17] + 1) : 0;

                  static bool last_light = false;
                  static int last_brt = -1;
                  static int last_ct = -1;
                  static bool last_fan_run = false;
                  static int last_fan_spd = -1;
                  static uint32_t last_report = 0;
                  static uint32_t last_change = 0;
                  static uint8_t retry_count = 0;

                  bool changed = (light_on != last_light) || (brt != last_brt) || 
                                 (ct_k != last_ct) || (fan_run != last_fan_run) || (fan_spd != last_fan_spd);
                  
                  if (changed) {
                    last_change = millis();
                    retry_count = 0;
                    last_light = light_on; last_brt = brt; last_ct = ct_k;
                    last_fan_run = fan_run; last_fan_spd = fan_spd;
                  }
                  
                  bool heartbeat = (millis() - last_report > 60000);
                  bool retry = (millis() - last_change < 10000) && (retry_count < 3) && (millis() - last_report > 3000);

                  if (changed || heartbeat || retry) {
                    if (retry) retry_count++;
                    else retry_count = 0;
                    
                    last_report = millis();

                    const char* reason = changed ? "CHANGE" : (retry ? "RETRY" : "HEARTBEAT");
                    ESP_LOGI("DINING", "[%s] Light:%d Brt:%d CT:%dK Fan:%d Spd:%d", 
                             reason, light_on, brt, ct_k, fan_run, fan_spd);

                    if (light_on) {
                      id(bemfa).publish("ctlight002/up", "on#" + to_string(brt) + "#" + to_string(ct_k));
                    } else {
                      id(bemfa).publish("ctlight002/up", "off");
                    }
                    
                    if (fan_run) {
                      id(bemfa).publish("ctfan003/up", "on#" + to_string(fan_spd));
                    } else {
                      id(bemfa).publish("ctfan003/up", "off");
                    }

                    id(ct_light_state).publish_state(light_on);
                    id(ct_light_brt).publish_state(brt);
                    id(ct_light_ct).publish_state(ct_k);
                    id(ct_fan_state).publish_state(fan_run);
                    id(ct_fan_spd).publish_state(fan_spd);
                    
                    // 🔥 同步开关状态
                    id(ct_light_sw).publish_state(light_on);
                    id(ct_fan_sw).publish_state(fan_run);
                  }
                  break;
                }
              }

              // ===== Bedroom 次卧设备 (F0:CF:2D:70:00:00) =====
              uint8_t cw_mac[6] = {0xF0, 0xCF, 0x2D, 0x70, 0x00, 0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], cw_mac, 6) == 0) {
                  bool light_on = (raw[i + 7] == 0x01);
                  int brt = (int)(raw[i + 12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500 - 2700) * (int)(raw[i + 13] / 255.0f * 100.0f) / 100;
                  uint8_t fan_state = raw[i + 16];
                  bool fan_run = (fan_state & 0x01) != 0;
                  int fan_spd = fan_run ? (raw[i + 17] + 1) : 0;

                  static bool last_light = false;
                  static int last_brt = -1;
                  static int last_ct = -1;
                  static bool last_fan_run = false;
                  static int last_fan_spd = -1;
                  static uint32_t last_report = 0;
                  static uint32_t last_change = 0;
                  static uint8_t retry_count = 0;

                  bool changed = (light_on != last_light) || (brt != last_brt) || 
                                 (ct_k != last_ct) || (fan_run != last_fan_run) || (fan_spd != last_fan_spd);
                  
                  if (changed) {
                    last_change = millis();
                    retry_count = 0;
                    last_light = light_on; last_brt = brt; last_ct = ct_k;
                    last_fan_run = fan_run; last_fan_spd = fan_spd;
                  }
                  
                  bool heartbeat = (millis() - last_report > 60000);
                  bool retry = (millis() - last_change < 10000) && (retry_count < 3) && (millis() - last_report > 3000);

                  if (changed || heartbeat || retry) {
                    if (retry) retry_count++;
                    else retry_count = 0;
                    
                    last_report = millis();

                    const char* reason = changed ? "CHANGE" : (retry ? "RETRY" : "HEARTBEAT");
                    ESP_LOGI("BEDROOM", "[%s] Light:%d Brt:%d CT:%dK Fan:%d Spd:%d", 
                             reason, light_on, brt, ct_k, fan_run, fan_spd);

                    if (light_on) {
                      id(bemfa).publish("cwlight002/up", "on#" + to_string(brt) + "#" + to_string(ct_k));
                    } else {
                      id(bemfa).publish("cwlight002/up", "off");
                    }
                    
                    if (fan_run) {
                      id(bemfa).publish("cwfan003/up", "on#" + to_string(fan_spd));
                    } else {
                      id(bemfa).publish("cwfan003/up", "off");
                    }

                    id(cw_light_state).publish_state(light_on);
                    id(cw_light_brt).publish_state(brt);
                    id(cw_light_ct).publish_state(ct_k);
                    id(cw_fan_state).publish_state(fan_run);
                    id(cw_fan_spd).publish_state(fan_spd);
                    
                    // 🔥 同步开关状态
                    id(cw_light_sw).publish_state(light_on);
                    id(cw_fan_sw).publish_state(fan_run);
                  }
                  break;
                }
              }
            }

