# ===================== 项目配置 =====================
substitutions:
  project_name: "cct1"
  build_time: "Unknown"

esphome:
  name: ble-6
  friendly_name: "${project_name}"
  comment: "${project_name} - Build: ${build_time}"
  includes:
    - midea_ble_controller.h
  on_boot:
    priority: 600
    then:
      - lambda: |-
          ble_set_send_function([](const std::string& hex) {
              id(tx).send_hex(hex);
          });
          mqtt_set_publish_function([](const char* topic, const char* payload) {
              id(bemfa).publish(topic, payload);
          });
          register_entity_sync([](int idx, const MideaDevice& dev) {
              if (idx == 0) {
                  id(ct_light_on).publish_state(dev.light_on);
                  id(ct_fan_on).publish_state(dev.fan_on);
                  id(ct_brt).publish_state(dev.brightness);
                  id(ct_ct).publish_state(dev.color_temp);
                  id(ct_spd).publish_state(dev.fan_speed);
                  id(ct_brt_n).publish_state(dev.brightness);
                  id(ct_ct_n).publish_state(dev.color_temp);
                  id(ct_spd_n).publish_state(dev.fan_speed);
                  id(ct_light_sw).publish_state(dev.light_on);
                  id(ct_fan_sw).publish_state(dev.fan_on);
              } else if (idx == 1) {
                  id(cw_light_on).publish_state(dev.light_on);
                  id(cw_fan_on).publish_state(dev.fan_on);
                  id(cw_brt).publish_state(dev.brightness);
                  id(cw_ct).publish_state(dev.color_temp);
                  id(cw_spd).publish_state(dev.fan_speed);
                  id(cw_brt_n).publish_state(dev.brightness);
                  id(cw_ct_n).publish_state(dev.color_temp);
                  id(cw_spd_n).publish_state(dev.fan_speed);
                  id(cw_light_sw).publish_state(dev.light_on);
                  id(cw_fan_sw).publish_state(dev.fan_on);
              } else if (idx == 2) {
                  id(zzw_light_on).publish_state(dev.light_on);
                  id(zzw_fan_on).publish_state(dev.fan_on);
                  id(zzw_brt).publish_state(dev.brightness);
                  id(zzw_ct).publish_state(dev.color_temp);
                  id(zzw_spd).publish_state(dev.fan_speed);
                  id(zzw_brt_n).publish_state(dev.brightness);
                  id(zzw_ct_n).publish_state(dev.color_temp);
                  id(zzw_spd_n).publish_state(dev.fan_speed);
                  id(zzw_light_sw).publish_state(dev.light_on);
                  id(zzw_fan_sw).publish_state(dev.fan_on);
              } else if (idx == 3) {
                  id(kkt_light_on).publish_state(dev.light_on);
                  id(kkt_fan_on).publish_state(dev.fan_on);
                  id(kkt_brt).publish_state(dev.brightness);
                  id(kkt_ct).publish_state(dev.color_temp);
                  id(kkt_spd).publish_state(dev.fan_speed);
                  id(kkt_brt_n).publish_state(dev.brightness);
                  id(kkt_ct_n).publish_state(dev.color_temp);
                  id(kkt_spd_n).publish_state(dev.fan_speed);
                  id(kkt_light_sw).publish_state(dev.light_on);
                  id(kkt_fan_sw).publish_state(dev.fan_on);
              }
          });

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: y

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: "CC"
  password: "chen1122"
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "BLE-GW Fallback"
    password: "12345678"

captive_portal:
web_server:
  port: 80
ota:
  - platform: esphome
api:
  reboot_timeout: 0s
  services:
    - service: send_raw_hex
      variables:
        hex_data: string
      then:
        - lambda: 'id(tx).send_hex(hex_data);'

external_components:
  - source:
      type: local
      path: components

ble_tx:
  id: tx

esp32_ble:
  io_capability: none
  enable_on_boot: true

bluetooth_proxy:
  active: true
  cache_services: true

# ===================== 全局变量 =====================
globals:
  - id: ct_current_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'
  - id: cw_current_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'
  - id: zzw_current_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'
  - id: kkt_current_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'
  - id: do_factory_reset
    type: bool
    restore_value: no
    initial_value: 'false'

# ===================== 巴法云 MQTT =====================
mqtt:
  id: bemfa
  broker: bemfa.com
  port: 9501
  username: "97109945d7e24559b3e4ca7a1f8ef160"
  password: "97109945d7e24559b3e4ca7a1f8ef160"
  client_id: "97109945d7e24559b3e4ca7a1f8ef160"
  keepalive: 30s
  discovery: false
  birth_message:
  will_message:
  on_connect:
    - delay: 2s
    - lambda: |-
        publish_all_devices();
  on_message:
    - topic: "ctlight002"
      then:
        - lambda: 'handle_light_mqtt(0, x);'
    - topic: "ctfan003"
      then:
        - lambda: 'handle_fan_mqtt(0, x);'
    - topic: "cwlight002"
      then:
        - lambda: 'handle_light_mqtt(1, x);'
    - topic: "cwfan003"
      then:
        - lambda: 'handle_fan_mqtt(1, x);'
    - topic: "zzwlight002"
      then:
        - lambda: 'handle_light_mqtt(2, x);'
    - topic: "zzwfan003"
      then:
        - lambda: 'handle_fan_mqtt(2, x);'
    - topic: "kktlight002"
      then:
        - lambda: 'handle_light_mqtt(3, x);'
    - topic: "kktfan003"
      then:
        - lambda: 'handle_fan_mqtt(3, x);'

# ===================== BLE 扫描 =====================
esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            auto datas = x.get_manufacturer_datas();
            for (auto &data : datas) {
              parse_ble_advertisement(data.data);
            }

# ===================== 定时任务 =====================
interval:
  - interval: 50ms
    then:
      - lambda: 'tick_ble_queue();'
  - interval: 60s
    then:
      - lambda: 'tick_heartbeat();'

# ===================== LED 输出 =====================
output:
  - platform: gpio
    id: blue_led_out
    pin:
      number: GPIO2
      inverted: true
  - platform: gpio
    id: white_led_out
    pin:
      number: GPIO4
      inverted: true

# ===================== LED 灯光 =====================
light:
  - platform: binary
    name: Blue LED
    id: blue_led
    output: blue_led_out
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: binary
    name: White LED
    id: white_led
    output: white_led_out
    restore_mode: RESTORE_DEFAULT_OFF

# ===================== 按键 =====================
binary_sensor:
  - platform: status
    name: "Gateway Online"
    device_class: connectivity
  - platform: template
    name: "Dining Light On"
    id: ct_light_on
    device_class: light
  - platform: template
    name: "Dining Fan On"
    id: ct_fan_on
    device_class: running
  - platform: template
    name: "Bedroom Light On"
    id: cw_light_on
    device_class: light
  - platform: template
    name: "Bedroom Fan On"
    id: cw_fan_on
    device_class: running
  - platform: template
    name: "Master Light On"
    id: zzw_light_on
    device_class: light
  - platform: template
    name: "Master Fan On"
    id: zzw_fan_on
    device_class: running
  - platform: template
    name: "Living Room Light On"
    id: kkt_light_on
    device_class: light
  - platform: template
    name: "Living Room Fan On"
    id: kkt_fan_on
    device_class: running
  - platform: gpio
    id: key1
    name: KEY1
    pin: { number: GPIO34, inverted: true }
    filters: [delayed_on: 20ms, delayed_off: 20ms]
    on_multi_click:
      - timing: [ON for at least 8s]
        then:
          - if:
              condition: { binary_sensor.is_on: key4 }
              then:
                - delay: 500ms
                - if:
                    condition: { binary_sensor.is_on: key4 }
                    then:
                      - lambda: 'id(do_factory_reset) = true;'
                      - repeat:
                          count: 5
                          then:
                            - light.toggle: white_led
                            - delay: 100ms
                      - lambda: 'App.reboot();'
      - timing: [ON for at least 1.5s]
        then:
          - light.turn_on: blue_led
          - delay: 200ms
          - light.turn_off: blue_led
          - homeassistant.event:
              event: esphome.gateway_key
              data: { key: "key1", mode: "long" }
      - timing: [ON for at most 0.5s, OFF for at most 0.3s, ON for at most 0.5s, OFF for at least 0.3s]
        then:
          - light.turn_on: blue_led
          - delay: 200ms
          - light.turn_off: blue_led
          - homeassistant.event:
              event: esphome.gateway_key
              data: { key: "key1", mode: "double" }
      - timing: [ON for at most 0.5s, OFF for at least 0.3s]
        then:
          - light.turn_on: blue_led
          - delay: 200ms
          - light.turn_off: blue_led
          - homeassistant.event:
              event: esphome.gateway_key
              data: { key: "key1", mode: "single" }
  - platform: gpio
    id: key2
    name: KEY2
    pin: { number: GPIO35, inverted: true }
    filters: [delayed_on: 20ms, delayed_off: 20ms]
    on_multi_click:
      - timing: [ON for at least 1.5s]
        then:
          - light.turn_on: blue_led
          - delay: 200ms
          - light.turn_off: blue_led
          - homeassistant.event:
              event: esphome.gateway_key
              data: { key: "key2", mode: "long" }
      - timing: [ON for at most 0.5s, OFF for at least 0.3s]
        then:
          - light.turn_on: blue_led
          - delay: 200ms
          - light.turn_off: blue_led
          - homeassistant.event:
              event: esphome.gateway_key
              data: { key: "key2", mode: "single" }
  - platform: gpio
    id: key3
    name: KEY3
    pin: { number: GPIO32, inverted: true }
    filters: [delayed_on: 20ms, delayed_off: 20ms]
    on_multi_click:
      - timing: [ON for at least 1.5s]
        then:
          - light.turn_on: blue_led
          - delay: 200ms
          - light.turn_off: blue_led
          - homeassistant.event:
              event: esphome.gateway_key
              data: { key: "key3", mode: "long" }
      - timing: [ON for at most 0.5s, OFF for at least 0.3s]
        then:
          - light.turn_on: blue_led
          - delay: 200ms
          - light.turn_off: blue_led
          - homeassistant.event:
              event: esphome.gateway_key
              data: { key: "key3", mode: "single" }
  - platform: gpio
    id: key4
    name: KEY4
    pin: { number: GPIO33, inverted: true }
    filters: [delayed_on: 20ms, delayed_off: 20ms]
    on_multi_click:
      - timing: [ON for at least 1.5s]
        then:
          - light.turn_on: blue_led
          - delay: 200ms
          - light.turn_off: blue_led
          - homeassistant.event:
              event: esphome.gateway_key
              data: { key: "key4", mode: "long" }
      - timing: [ON for at most 0.5s, OFF for at least 0.3s]
        then:
          - light.turn_on: blue_led
          - delay: 200ms
          - light.turn_off: blue_led
          - homeassistant.event:
              event: esphome.gateway_key
              data: { key: "key4", mode: "single" }

# ===================== 开关 =====================
switch:
  - platform: template
    name: "Dining Light"
    id: ct_light_sw
    icon: mdi:ceiling-light
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          g_devices[0].light_on = true;
          if (g_devices[0].brightness < 1) g_devices[0].brightness = 50;
          ble_queue_add(g_devices[0].cmd_light_on(), 0);
          id(ct_light_on).publish_state(true);
    turn_off_action:
      - lambda: |-
          g_devices[0].light_on = false;
          ble_queue_add(g_devices[0].cmd_light_off(), 0);
          id(ct_light_on).publish_state(false);
    lambda: 'return g_devices[0].light_on;'
  - platform: template
