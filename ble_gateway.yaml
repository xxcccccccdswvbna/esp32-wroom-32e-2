# ===================== 原生灯光组件 (基础语法版) =====================
light:
  # === 餐厅灯 ===
  - platform: template
    name: "Dining Light 餐厅灯"
    id: ct_light
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          auto values = id(ct_light).remote_values;
          int brt_pct = std::round(values.get_brightness() * 100.0f);
          int ct_k = std::round(1000000.0f / values.get_color_temperature());
          int bv = std::round(brt_pct * 255.0 / 100.0);
          int tv = std::round((ct_k - 2700.0) * 255.0 / 3800.0);
          if (tv < 0) tv = 0;
          if (tv > 255) tv = 255;

          std::string mac = "488027700000";
          auto build = [&](std::vector<uint8_t> v, int cf, int ef) -> std::string {
            uint8_t hx[6]; 
            for(int i=0; i<6; i++) hx[i] = std::stoi(mac.substr(i*2, 2), nullptr, 16);
            uint8_t tb[16]; 
            int l=0, r=1; 
            for(int i=0; i<15; i++) {
              tb[i] = (hx[l] + hx[r]) & 0xFF;
              r++;
              if(r == 6) { l++; r = l + 1; }
            }
            tb[15] = 0;
            for(int i=0; i<6; i++) tb[15] = (tb[15] + hx[i]) & 0xFF;
            
            auto pkt = [&](int fl) -> std::string {
              uint8_t ch = 1, ver = 1;
              uint8_t ct = (v.size() > 1) ? 1 : 0;
              uint8_t ck = (ch + ver + ct);
              for(size_t i=0; i<v.size(); i++) ck = (ck + v[i]) & 0xFF;
              
              std::vector<uint8_t> p;
              p.push_back(ch); p.push_back(ver); p.push_back(ct);
              for(size_t i=0; i<v.size(); i++) p.push_back(v[i]);
              while(p.size() < 15) p.push_back(0);
              p.push_back(ck);
              
              const char* H = "0123456789ABCDEF";
              auto th = [&](uint8_t b) -> std::string {
                std::string res = "";
                res += H[b >> 4];
                res += H[b & 0xF];
                return res;
              };
              
              std::string s = "0201021BFF114D19";
              s += th(0x10 | (fl & 0xF));
              s += mac;
              s += "01";
              
              int idx = fl & 0xF;
              for(size_t i=1; i<16; i++) {
                s += th(p[i] ^ tb[idx % 16]);
                idx++;
              }
              return s;
            };
            return pkt(cf) + "|" + pkt(ef);
          };

          std::vector<uint8_t> vals;
          vals.push_back(0x5B); vals.push_back((uint8_t)bv); vals.push_back((uint8_t)tv);
          id(tx).send_hex(build(vals, 2, 4));
          id(bemfa).publish("ctlight002/up", "on#" + std::to_string(brt_pct) + "#" + std::to_string(ct_k));

    turn_off_action:
      - lambda: |-
          std::string mac = "488027700000";
          auto build = [&](std::vector<uint8_t> v, int cf, int ef) -> std::string {
            uint8_t hx[6]; for(int i=0; i<6; i++) hx[i] = std::stoi(mac.substr(i*2, 2), nullptr, 16);
            uint8_t tb[16]; int l=0, r=1; for(int i=0; i<15; i++) { tb[i] = (hx[l] + hx[r]) & 0xFF; r++; if(r == 6) { l++; r = l + 1; } }
            tb[15] = 0; for(int i=0; i<6; i++) tb[15] = (tb[15] + hx[i]) & 0xFF;
            auto pkt = [&](int fl) -> std::string {
              uint8_t ch = 1, ver = 1, ct = (v.size() > 1) ? 1 : 0, ck = (ch + ver + ct);
              for(size_t i=0; i<v.size(); i++) ck = (ck + v[i]) & 0xFF;
              std::vector<uint8_t> p; p.push_back(ch); p.push_back(ver); p.push_back(ct);
              for(size_t i=0; i<v.size(); i++) p.push_back(v[i]);
              while(p.size() < 15) p.push_back(0); p.push_back(ck);
              const char* H = "0123456789ABCDEF";
              auto th = [&](uint8_t b) -> std::string { std::string res = ""; res += H[b >> 4]; res += H[b & 0xF]; return res; };
              std::string s = "0201021BFF114D19"; s += th(0x10 | (fl & 0xF)); s += mac; s += "01";
              int idx = fl & 0xF; for(size_t i=1; i<16; i++) { s += th(p[i] ^ tb[idx % 16]); idx++; }
              return s;
            };
            return pkt(cf) + "|" + pkt(ef);
          };
          std::vector<uint8_t> vals; vals.push_back(0x06);
          id(tx).send_hex(build(vals, 2, 4));
          id(bemfa).publish("ctlight002/up", "off");

