# ===================== 项目配置 =====================
substitutions:
  project_name: "byy1"
  build_time: "Unknown"

esphome:
  name: ble-2
  friendly_name: "${project_name}"
  comment: "${project_name} - Build: ${build_time}"

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: "y"
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_BLE_ENABLED: "y"
      CONFIG_ESP32_EFUSE_MAC_CUSTOM_CHECK: "n"
      CONFIG_ESPTOOLPY_FLASHMODE_DIO: "y"
      CONFIG_ESPTOOLPY_FLASHFREQ_40MHZ: "y"
      CONFIG_ESP_INT_WDT_TIMEOUT_MS: "8000"
      CONFIG_TASK_WDT_TIMEOUT_S: "10"

# ===================== 系统基础 =====================
logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: "CC"
  password: "chen1122"
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "BLE-GW Fallback"
    password: "12345678"

captive_portal:
web_server:
  port: 80
ota:
  - platform: esphome
    # 【重要】这颗芯片不要网页OTA，保留配置仅作备用，实际只用串口刷写
api:
  reboot_timeout: 0s

# ===================== BLE 组件 =====================
external_components:
  - source:
      type: local
      path: components

ble_tx:
  id: tx

esp32_ble:
  io_capability: none
  enable_on_boot: true
  
bluetooth_proxy:
  active: true
  cache_services: true





