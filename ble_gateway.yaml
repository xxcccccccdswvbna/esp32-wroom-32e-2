# ===================== 原生风扇组件 (基础语法版) =====================
fan:
  # === 餐厅风扇 ===
  - platform: template
    name: "Dining Fan 餐厅风扇"
    id: ct_fan
    speed_count: 6
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          int spd = id(ct_fan).speed;
          if (spd == 0) spd = 1;
          uint8_t cmd = 0x19; int cf = 10, ef = 7;
          if (spd == 1) { cmd = 0x19; cf = 10; ef = 7; }
          else if (spd == 2) { cmd = 0x1A; cf = 0; ef = 5; }
          else if (spd == 3) { cmd = 0x81; cf = 13; ef = 5; }
          else if (spd == 4) { cmd = 0x88; cf = 8; ef = 12; }
          else if (spd == 5) { cmd = 0x85; cf = 10; ef = 12; }
          else if (spd == 6) { cmd = 0x86; cf = 5; ef = 1; }

          std::string mac = "488027700000";
          auto build = [&](std::vector<uint8_t> v, int cf, int ef) -> std::string {
            uint8_t hx[6]; for(int i=0; i<6; i++) hx[i] = std::stoi(mac.substr(i*2, 2), nullptr, 16);
