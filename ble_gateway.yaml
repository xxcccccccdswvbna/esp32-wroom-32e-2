          std::string mac = "F0CF2D700000";
          auto build_cmd = [&](const std::vector<uint8_t>& vals, int cf, int ef) -> std::string {
              uint8_t hx[6]; for(int i=0;i<6;i++) hx[i] = std::stoi(mac.substr(i*2, 2), nullptr, 16);
              uint8_t table[16]; int l=0, r=1;
              for(int i=0; i<15; i++) { table[i] = (hx[l] + hx[r]) & 0xFF; r++; if(r==6){l++; r=l+1;} }
              table[15] = 0; for(int i=0;i<6;i++) table[15] = (table[15] + hx[i]) & 0xFF;
              auto make_pkt = [&](int flag) {
                  uint8_t ch=0x01, ver=0x01, cmd_type = (vals.size()>1)?0x01:0x00, chk = (ch+ver+cmd_type);
                  for(auto v:vals) chk = (chk+v)&0xFF;
                  std::vector<uint8_t> p = {ch, ver, cmd_type};
                  for(auto v:vals) p.push_back(v);
                  while(p.size()<15) p.push_back(0x00);
                  p.push_back(chk);
                  const char* hex = "0123456789ABCDEF";
                  auto to_h = [&](uint8_t b){ return std::string(1, hex[b>>4]) + hex[b&0x0F]; };
                  std::string res = "0201021BFF114D19" + to_h(0x10 | (flag&0x0F)) + mac + "01";
                  int idx = flag & 0x0F;
                  for(int i=1; i<16; i++) { res += to_h(p[i] ^ table[idx%16]); idx++; }
                  return res;
              };
              return make_pkt(cf) + "|" + make_pkt(ef);
          };
          id(tx).send_hex(build_cmd({0x5B, (uint8_t)brt_val, (uint8_t)temp_val}, 2, 4));
          id(bemfa).publish("cwlight002/up", "on#" + std::to_string(brt) + "#" + std::to_string(ct_k));
    turn_off_action:
      - lambda: |-
          std::string mac = "F0CF2D700000";
          auto build_cmd = [&](const std::vector<uint8_t>& vals, int cf, int ef) -> std::string {
              uint8_t hx[6]; for(int i=0;i<6;i++) hx[i] = std::stoi(mac.substr(i*2, 2), nullptr, 16);
              uint8_t table[16]; int l=0, r=1;
