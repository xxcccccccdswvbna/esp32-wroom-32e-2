# ===================== 项目配置 =====================
substitutions:
  project_name: "byy1"
  build_time: "Unknown"

esphome:
  name: ble-2
  friendly_name: "${project_name}"
  comment: "${project_name} - Build: ${build_time}"
  includes:
    - midea_ble_controller.h

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: y

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: "CC"
  password: "chen1122"
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "BLE-GW Fallback"
    password: "12345678"

captive_portal:
web_server:
  port: 80
ota:
  - platform: esphome
api:
  reboot_timeout: 0s
  services:
    - service: send_raw_hex
      variables:
        hex_data: string
      then:
        - lambda: 'id(tx).send_hex(hex_data);'

external_components:
  - source:
      type: local
      path: components

ble_tx:
  id: tx

esp32_ble:
  io_capability: none
  enable_on_boot: true

bluetooth_proxy:
  active: true
  cache_services: true

# ===================== 全局变量 =====================
globals:
  - id: ct_current_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'
  - id: cw_current_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'
  - id: zzw_current_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'
  - id: kkt_current_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'

# ===================== 巴法云 MQTT =====================
mqtt:
  id: bemfa
  broker: bemfa.com
  port: 9501
  username: "97109945d7e24559b3e4ca7a1f8ef160"
  password: "97109945d7e24559b3e4ca7a1f8ef160"
  client_id: "97109945d7e24559b3e4ca7a1f8ef160"
  keepalive: 30s
  discovery: false
  birth_message:
  will_message:
  on_message:
    # ===== 餐厅灯 =====
    - topic: "ctlight002"
      then:
        - lambda: |-
            if(x == "on") {
              int ct = id(ct_current_ct_kelvin);
              int brt = id(ct_brt).state;
              if(brt < 1) brt = 50;
              id(tx).send_hex(midea_light_on("488027700000", brt, ct));
              id(ct_light_on).publish_state(true);
              id(ct_brt).publish_state(brt);
              id(ct_ct).publish_state(ct);
            } else if(x == "off") {
              id(tx).send_hex(midea_light_off("488027700000"));
              id(ct_light_on).publish_state(false);
            } else if(x.find("on#") == 0) {
              std::string rest = x.substr(3);
              size_t pos = rest.find('#');
              int brt = std::stoi(rest.substr(0, pos));
              int ct = id(ct_current_ct_kelvin);
              if(pos != std::string::npos) {
                std::string ct_str = rest.substr(pos + 1);
                if(!ct_str.empty()) {
                  int pct = std::stoi(ct_str);
                  if(pct >= 2700 && pct <= 6500) { ct = pct; id(ct_current_ct_kelvin) = ct; }
                }
              }
              id(tx).send_hex(midea_light_on("488027700000", brt, ct));
              id(ct_light_on).publish_state(true);
              id(ct_brt).publish_state(brt);
              id(ct_ct).publish_state(ct);
            }

    # ===== 餐厅风扇 =====
    - topic: "ctfan003"
      then:
        - lambda: |-
            if(x == "on") {
              int spd = id(ct_spd).state;
              if(spd < 1) spd = 1;
              id(tx).send_hex(midea_fan_on("488027700000", spd));
              id(ct_fan_on).publish_state(true);
              id(ct_spd).publish_state(spd);
            } else if(x == "off") {
              id(tx).send_hex(midea_fan_off("488027700000"));
