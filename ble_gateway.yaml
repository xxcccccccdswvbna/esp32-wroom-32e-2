# ===================== 传感器 =====================
sensor:
  - platform: template
    name: "Dining Brt Sensor"
    id: ct_brt_s
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dining CT Sensor"
    id: ct_ct_s
    unit_of_measurement: "K"
  - platform: template
    name: "Dining Spd Sensor"
    id: ct_spd_s
  - platform: template
    name: "Bedroom Brt Sensor"
    id: cw_brt_s
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Bedroom CT Sensor"
    id: cw_ct_s
    unit_of_measurement: "K"
  - platform: template
    name: "Bedroom Spd Sensor"
    id: cw_spd_s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: internal_temperature
    name: "ESP32 Temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi dBm"
    id: wifi_signal_db
    update_interval: 60s
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Pct"
    filters:
      - lambda: return min(max(2*(x+100.0),0.0),100.0);
    unit_of_measurement: "%"
    accuracy_decimals: 0

binary_sensor:
  - platform: status
    name: "Gateway Online"
    device_class: connectivity
  - platform: template
    name: "Dining Light State"
    id: ct_light_st
    device_class: light
  - platform: template
    name: "Bedroom Light State"
    id: cw_light_st
    device_class: light
  - platform: template
    name: "Dining Fan State"
    id: ct_fan_st
    device_class: running
  - platform: template
    name: "Bedroom Fan State"
    id: cw_fan_st
    device_class: running

text_sensor:
  - platform: template
    name: "Build Time"
    lambda: 'return {"${build_time}"};'
    update_interval: 3600s
  - platform: version
    name: "ESPHome Ver"
    hide_timestamp: true
  - platform: wifi_info
    ip_address:
      name: "ESP IP"
    ssid:
      name: "ESP SSID"
    mac_address:
      name: "ESP MAC"

button:
  - platform: restart
    name: "Restart GW"
    icon: mdi:restart
    entity_category: diagnostic
