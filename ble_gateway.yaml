  on_message:
    # === 餐厅灯 ===
    - topic: "ctlight002"
      then:
        - lambda: |-
            std::string mac = "488027700000";
            auto build = [&](std::vector<uint8_t> vals, int cf, int ef) -> std::string {
              uint8_t hx[6]; for(int i=0;i<6;i++) hx[i]=std::stoi(mac.substr(i*2,2),nullptr,16);
              uint8_t tb[16]; int l=0,r=1;
              for(int i=0;i<15;i++){tb[i]=(hx[l]+hx[r])&0xFF;r++;if(r==6){l++;r=l+1;}}
              tb[15]=0;for(int i=0;i<6;i++)tb[15]=(tb[15]+hx[i])&0xFF;
              auto pkt=[&](int fl)->std::string{
                uint8_t ch=1,ver=1,ct=(vals.size()>1)?1:0,ck=(ch+ver+ct);
                for(auto v:vals)ck=(ck+v)&0xFF;
                std::vector<uint8_t> p={ch,ver,ct};for(auto v:vals)p.push_back(v);
                while(p.size()<15)p.push_back(0);p.push_back(ck);
                const char*H="0123456789ABCDEF";
                auto th=[&](uint8_t b){return std::string(1,H[b>>4])+H[b&0xF];};
                std::string s="0201021BFF114D19"+th(0x10|(fl&0xF))+mac+"01";
                int idx=fl&0xF;for(int i=1;i<16;i++){s+=th(p[i]^tb[idx%16]);idx++;}
                return s;};
              return pkt(cf)+"|"+pkt(ef);};
            if(x=="on"||x=="off") id(tx).send_hex(build({0x06},2,4));
            else if(x.find("on#")==0){
              std::string rest=x.substr(3);int v=std::stoi(rest);
              size_t p2=rest.find('#');int ck=4500;
              if(p2!=std::string::npos){int k=std::stoi(rest.substr(p2+1));
                if(k>10000)ck=4500;else if(k<=100)ck=2700+(6500-2700)*k/100;else ck=k;}
              int bv=std::round(v*255.0/100.0);
              int tv=std::max(0,std::min(255,(int)std::round((ck-2700.0)*255.0/3800.0)));
