# ===================== 状态监听 → 上报巴法云 + HA (智能节流版) =====================
esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            auto datas = x.get_manufacturer_datas();
            for (auto &data : datas) {
                auto &raw = data.data;
                if (raw.size() < 20) continue;

                // ===== 餐厅 134D =====
                uint8_t ct_mac[6] = {0x48, 0x80, 0x27, 0x70, 0x00, 0x00};
                for (int i = 2; i <= (int)raw.size() - 6; i++) {
                    if (memcmp(&raw[i], ct_mac, 6) == 0) {
                        bool light_on = (raw[i + 7] == 0x01);
                        int brt = (int)(raw[i + 12] / 255.0f * 100.0f);
                        int ct_k = 2700 + (6500 - 2700) * (int)(raw[i + 13] / 255.0f * 100.0f) / 100;
                        uint8_t fan_state = raw[i + 16];
                        bool fan_run = (fan_state & 0x01) != 0; 
                        int fan_spd = fan_run ? (raw[i + 17] + 1) : 0;

                        static bool ct_last_light = false;
                        static int ct_last_brt = -1;
                        static int ct_last_ct = -1;
                        static bool ct_last_fan_run = false;
                        static int ct_last_fan_spd = -1;
                        static uint32_t ct_last_report = 0;
                        static uint32_t ct_last_change = 0;
                        static uint8_t ct_retry_count = 0;

                        bool changed = (light_on != ct_last_light) || (brt != ct_last_brt) || 
                                       (ct_k != ct_last_ct) || (fan_run != ct_last_fan_run) || (fan_spd != ct_last_fan_spd);
                        
                        if (changed) {
                            ct_last_change = millis();
                            ct_retry_count = 0;
                            ct_last_light = light_on; ct_last_brt = brt; ct_last_ct = ct_k;
                            ct_last_fan_run = fan_run; ct_last_fan_spd = fan_spd;
                        }
                        
                        bool heartbeat = (millis() - ct_last_report > 60000);
                        bool retry = (millis() - ct_last_change < 10000) && (ct_retry_count < 3) && (millis() - ct_last_report > 3000);

                        if (changed || heartbeat || retry) {
                            if (retry) ct_retry_count++;
                            else ct_retry_count = 0;
                            
                            ct_last_report = millis();

                            const char* reason = changed ? "CHANGE" : (retry ? "RETRY" : "HEARTBEAT");
                            ESP_LOGI("134D", "ct REPORT [%s] L:%d B:%d C:%d F:%d S:%d", reason, light_on, brt, ct_k, fan_run, fan_spd);

                            // 🔥 1. 发给巴法云 (供小爱/米家同步)
                            if (light_on) id(bemfa).publish("ctlight002/up", "on#" + std::to_string(brt) + "#" + std::to_string(ct_k));
                            else id(bemfa).publish("ctlight002/up", "off");
                            
                            if (fan_run) id(bemfa).publish("ctfan003/up", "on#" + std::to_string(fan_spd));
                            else id(bemfa).publish("ctfan003/up", "off");

                            // 🔥 2. 发给内部传感器 (通过 API 瞬间同步给 HA，无需本地 MQTT)
                            id(ct_light_state).publish_state(light_on);
                            id(ct_light_brt).publish_state(brt);
                            id(ct_light_ct).publish_state(ct_k);
                            id(ct_fan_state).publish_state(fan_run);
                            id(ct_fan_spd).publish_state(fan_spd);
                        }
                        break;
                    }
                }

                // ===== 次卧 134D =====
                uint8_t cw_mac[6] = {0xF0, 0xCF, 0x2D, 0x70, 0x00, 0x00};
                for (int i = 2; i <= (int)raw.size() - 6; i++) {
                    if (memcmp(&raw[i], cw_mac, 6) == 0) {
                        bool light_on = (raw[i + 7] == 0x01);
                        int brt = (int)(raw[i + 12] / 255.0f * 100.0f);
                        int ct_k = 2700 + (6500 - 2700) * (int)(raw[i + 13] / 255.0f * 100.0f) / 100;
                        uint8_t fan_state = raw[i + 16];
                        bool fan_run = (fan_state & 0x01) != 0;
                        int fan_spd = fan_run ? (raw[i + 17] + 1) : 0;

                        static bool cw_last_light = false;
                        static int cw_last_brt = -1;
                        static int cw_last_ct = -1;
                        static bool cw_last_fan_run = false;
                        static int cw_last_fan_spd = -1;
                        static uint32_t cw_last_report = 0;
                        static uint32_t cw_last_change = 0;
                        static uint8_t cw_retry_count = 0;

                        bool changed = (light_on != cw_last_light) || (brt != cw_last_brt) || 
                                       (ct_k != cw_last_ct) || (fan_run != cw_last_fan_run) || (fan_spd != cw_last_fan_spd);
                        
                        if (changed) {
                            cw_last_change = millis();
                            cw_retry_count = 0;
                            cw_last_light = light_on; cw_last_brt = brt; cw_last_ct = ct_k;
                            cw_last_fan_run = fan_run; cw_last_fan_spd = fan_spd;
                        }
                        
                        bool heartbeat = (millis() - cw_last_report > 60000);
                        bool retry = (millis() - cw_last_change < 10000) && (cw_retry_count < 3) && (millis() - cw_last_report > 3000);

                        if (changed || heartbeat || retry) {
                            if (retry) cw_retry_count++;
                            else cw_retry_count = 0;
                            
                            cw_last_report = millis();

                            const char* reason = changed ? "CHANGE" : (retry ? "RETRY" : "HEARTBEAT");
                            ESP_LOGI("134D", "cw REPORT [%s] L:%d B:%d C:%d F:%d S:%d", reason, light_on, brt, ct_k, fan_run, fan_spd);

                            // 🔥 1. 发给巴法云
                            if (light_on) id(bemfa).publish("cwlight002/up", "on#" + std::to_string(brt) + "#" + std::to_string(ct_k));
                            else id(bemfa).publish("cwlight002/up", "off");
                            
                            if (fan_run) id(bemfa).publish("cwfan003/up", "on#" + std::to_string(fan_spd));
                            else id(bemfa).publish("cwfan003/up", "off");

                            // 🔥 2. 发给内部传感器
                            id(cw_light_state).publish_state(light_on);
                            id(cw_light_brt).publish_state(brt);
                            id(cw_light_ct).publish_state(ct_k);
                            id(cw_fan_state).publish_state(fan_run);
                            id(cw_fan_spd).publish_state(fan_spd);
                        }
                        break;
                    }
                }
            }

