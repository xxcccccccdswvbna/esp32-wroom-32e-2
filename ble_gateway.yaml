# ===================== 项目配置 =====================
substitutions:
  project_name: "b11"
  build_time: "Unknown"

esphome:
  name: ble-2
  friendly_name: "${project_name}"
  comment: "${project_name} - Build: ${build_time}"
  includes:
    - midea_ble_controller.h

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: y

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: "CC"
  password: "chen1122"
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "BLE-GW Fallback"
    password: "12345678"

captive_portal:
web_server:
  port: 80
ota:
  - platform: esphome
api:
  reboot_timeout: 0s
  services:
    - service: send_raw_hex
      variables:
        hex_data: string
      then:
        - lambda: 'id(tx).send_hex(hex_data);'

external_components:
  - source:
      type: local
      path: components

ble_tx:
  id: tx

esp32_ble:
  io_capability: none
  enable_on_boot: true

bluetooth_proxy:
  active: true
  cache_services: true

# ===================== 巴法云 MQTT =====================
mqtt:
  id: bemfa
  broker: bemfa.com
  port: 9501
  username: "97109945d7e24559b3e4ca7a1f8ef160"
  password: "97109945d7e24559b3e4ca7a1f8ef160"
  client_id: "97109945d7e24559b3e4ca7a1f8ef160"
  keepalive: 30s
  discovery: false
  birth_message:
  will_message:

  # === 初始化: 绑定发送函数 ===
  on_connect:
    - lambda: |-
        // 绑定 BLE 发送函数
        ble_set_send_function([](const std::string& hex) {
            id(tx).send_hex(hex);
        });
        // 绑定 MQTT 发布函数
        mqtt_set_publish_function([](const char* topic, const char* payload) {
            id(bemfa).publish(topic, payload);
        });
    - delay: 2s
    - lambda: |-
        // 重连后全量同步所有设备状态
        publish_all_devices();

  on_message:
    # ===== 餐厅灯 =====
    - topic: "ctlight002"
      then:
        - lambda: 'handle_light_mqtt(0, x); id(ct_light_sw).publish_state(g_devices[0].light_on); id(ct_brt).publish_state(g_devices[0].brightness); id(ct_ct).publish_state(g_devices[0].color_temp);'

    # ===== 餐厅风扇 =====
    - topic: "ctfan003"
      then:
        - lambda: 'handle_fan_mqtt(0, x); id(ct_fan_sw).publish_state(g_devices[0].fan_on); id(ct_spd).publish_state(g_devices[0].fan_speed);'

    # ===== 次卧灯 =====
    - topic: "cwlight002"
      then:
        - lambda: 'handle_light_mqtt(1, x); id(cw_light_sw).publish_state(g_devices[1].light_on); id(cw_brt).publish_state(g_devices[1].brightness); id(cw_ct).publish_state(g_devices[1].color_temp);'

    # ===== 次卧风扇 =====
    - topic: "cwfan003"
      then:
        - lambda: 'handle_fan_mqtt(1, x); id(cw_fan_sw).publish_state(g_devices[1].fan_on); id(cw_spd).publish_state(g_devices[1].fan_speed);'

    # ===== 主卧灯 =====
    - topic: "zzwlight002"
      then:
        - lambda: 'handle_light_mqtt(2, x); id(zzw_light_sw).publish_state(g_devices[2].light_on); id(zzw_brt).publish_state(g_devices[2].brightness); id(zzw_ct).publish_state(g_devices[2].color_temp);'

    # ===== 主卧风扇 =====
    - topic: "zzwfan003"
      then:
        - lambda: 'handle_fan_mqtt(2, x); id(zzw_fan_sw).publish_state(g_devices[2].fan_on); id(zzw_spd).publish_state(g_devices[2].fan_speed);'

    # ===== 客厅灯 =====
    - topic: "kktlight002"
      then:
        - lambda: 'handle_light_mqtt(3, x); id(kkt_light_sw).publish_state(g_devices[3].light_on); id(kkt_brt).publish_state(g_devices[3].brightness); id(kkt_ct).publish_state(g_devices[3].color_temp);'

    # ===== 客厅风扇 =====
    - topic: "kktfan003"
      then:
        - lambda: 'handle_fan_mqtt(3, x); id(kkt_fan_sw).publish_state(g_devices[3].fan_on); id(kkt_spd).publish_state(g_devices[3].fan_speed);'

# ===================== BLE 扫描 (带 HA 实体精准同步) =====================
esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            auto datas = x.get_manufacturer_datas();
            for (auto &data : datas) {
              // 获取发生状态变化的设备索引
              int changed_idx = parse_ble_advertisement(data.data);
              
              // 只有当状态真正发生变化时，才精准同步给 Home Assistant 实体
              if (changed_idx == 0) { // 餐厅
                  id(ct_light_on).publish_state(g_devices[0].light_on);
                  id(ct_fan_on).publish_state(g_devices[0].fan_on);
                  id(ct_brt).publish_state(g_devices[0].brightness);
                  id(ct_ct).publish_state(g_devices[0].color_temp);
                  id(ct_spd).publish_state(g_devices[0].fan_speed);
                  id(ct_brt_n).publish_state(g_devices[0].brightness);
                  id(ct_ct_n).publish_state(g_devices[0].color_temp);
                  id(ct_spd_n).publish_state(g_devices[0].fan_speed);
              } else if (changed_idx == 1) { // 次卧
                  id(cw_light_on).publish_state(g_devices[1].light_on);
                  id(cw_fan_on).publish_state(g_devices[1].fan_on);
                  id(cw_brt).publish_state(g_devices[1].brightness);
                  id(cw_ct).publish_state(g_devices[1].color_temp);
                  id(cw_spd).publish_state(g_devices[1].fan_speed);
                  id(cw_brt_n).publish_state(g_devices[1].brightness);
                  id(cw_ct_n).publish_state(g_devices[1].color_temp);
                  id(cw_spd_n).publish_state(g_devices[1].fan_speed);
              } else if (changed_idx == 2) { // 主卧
                  id(zzw_light_on).publish_state(g_devices[2].light_on);
                  id(zzw_fan_on).publish_state(g_devices[2].fan_on);
                  id(zzw_brt).publish_state(g_devices[2].brightness);
                  id(zzw_ct).publish_state(g_devices[2].color_temp);
                  id(zzw_spd).publish_state(g_devices[2].fan_speed);
                  id(zzw_brt_n).publish_state(g_devices[2].brightness);
                  id(zzw_ct_n).publish_state(g_devices[2].color_temp);
                  id(zzw_spd_n).publish_state(g_devices[2].fan_speed);
              } else if (changed_idx == 3) { // 客厅
                  id(kkt_light_on).publish_state(g_devices[3].light_on);
                  id(kkt_fan_on).publish_state(g_devices[3].fan_on);
                  id(kkt_brt).publish_state(g_devices[3].brightness);
                  id(kkt_ct).publish_state(g_devices[3].color_temp);
                  id(kkt_spd).publish_state(g_devices[3].fan_speed);
                  id(kkt_brt_n).publish_state(g_devices[3].brightness);
                  id(kkt_ct_n).publish_state(g_devices[3].color_temp);
                  id(kkt_spd_n).publish_state(g_devices[3].fan_speed);
              }
            }

# ===================== 定时任务 =====================
interval:
  # BLE 发送队列处理 (每50ms)
  - interval: 50ms
    then:
      - lambda: 'tick_ble_queue();'
  
  # 心跳上报 (每60秒)
  - interval: 60s
    then:
      - lambda: 'tick_heartbeat();'

# ===================== 开关 =====================
switch:
  - platform: template
    name: "Dining Light"
    id: ct_light_sw
    icon: mdi:ceiling-light
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          g_devices[0].light_on = true;
          if (g_devices[0].brightness < 1) g_devices[0].brightness = 50;
          ble_queue_add(g_devices[0].cmd_light_on(), 0);
          id(ct_light_on).publish_state(true);
    turn_off_action:
      - lambda: |-
          g_devices[0].light_on = false;
          ble_queue_add(g_devices[0].cmd_light_off(), 0);
          id(ct_light_on).publish_state(false);
    lambda: 'return g_devices[0].light_on;'

  - platform: template
