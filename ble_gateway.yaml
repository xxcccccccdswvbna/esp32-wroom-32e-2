# ===================== 项目配置 =====================
substitutions:
  project_name: "byy1"
  build_time: "Unknown"

esphome:
  name: ble-2
  friendly_name: "${project_name}"
  comment: "${project_name} - Build: ${build_time}"
  includes:
    - midea_ble_controller.h

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: y

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: "CC"
  password: "chen1122"
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "BLE-GW Fallback"
    password: "12345678"

captive_portal:
web_server:
  port: 80
ota:
  - platform: esphome
api:
  reboot_timeout: 0s

# ===================== BLE 组件 =====================
external_components:
  - source:
      type: local
      path: components

ble_tx:
  id: tx

esp32_ble:
  io_capability: none
  enable_on_boot: true

bluetooth_proxy:
  active: true
  cache_services: true

# ===================== 巴法云 MQTT =====================
mqtt:
  id: bemfa
  broker: bemfa.com
  port: 9501
  username: "97109945d7e24559b3e4ca7a1f8ef160"
  password: "97109945d7e24559b3e4ca7a1f8ef160"
  client_id: "97109945d7e24559b3e4ca7a1f8ef160"
  keepalive: 30s
  discovery: false
  birth_message:
  will_message:
  on_message:
    - topic: "ctlight002"
      then:
        - lambda: |-
            if(x == "on" || x == "off") {
              id(tx).send_hex(midea_build_cmd("488027700000", {0x06}, 2, 4));
            } else if(x.find("on#") == 0) {
              std::string rest = x.substr(3);
              int brt = std::stoi(rest.substr(0, rest.find('#')));
              int ct = std::stoi(rest.substr(rest.find('#') + 1));
              uint8_t bv = midea_pct_to_val(brt);
              uint8_t tv = midea_kelvin_to_val(ct);
              id(tx).send_hex(midea_build_cmd("488027700000", {0x5B, bv, tv}, 2, 4));
            }

    - topic: "ctfan003"
      then:
        - lambda: |-
            if(x == "on" || x == "off") {
              id(tx).send_hex(midea_build_cmd("488027700000", {0x09}, 8, 15));
            } else if(x.find("on#") == 0) {
              int s = std::stoi(x.substr(3));
              uint8_t cmd; int cf, ef;
              midea_fan_params(s, cmd, cf, ef);
              id(tx).send_hex(midea_build_cmd("488027700000", {cmd}, cf, ef));
            }

    - topic: "cwlight002"
      then:
        - lambda: |-
            if(x == "on" || x == "off") {
              id(tx).send_hex(midea_build_cmd("F0CF2D700000", {0x06}, 2, 4));
            } else if(x.find("on#") == 0) {
              std::string rest = x.substr(3);
              int brt = std::stoi(rest.substr(0, rest.find('#')));
              int ct = std::stoi(rest.substr(rest.find('#') + 1));
              uint8_t bv = midea_pct_to_val(brt);
              uint8_t tv = midea_kelvin_to_val(ct);
              id(tx).send_hex(midea_build_cmd("F0CF2D700000", {0x5B, bv, tv}, 2, 4));
            }

    - topic: "cwfan003"
      then:
        - lambda: |-
            if(x == "on" || x == "off") {
              id(tx).send_hex(midea_build_cmd("F0CF2D700000", {0x09}, 8, 15));
            } else if(x.find("on#") == 0) {
              int s = std::stoi(x.substr(3));
              uint8_t cmd; int cf, ef;
              midea_fan_params(s, cmd, cf, ef);
              id(tx).send_hex(midea_build_cmd("F0CF2D700000", {cmd}, cf, ef));
            }

# ===================== BLE 扫描与状态上报 =====================
esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            auto datas = x.get_manufacturer_datas();
            for (auto &data : datas) {
              auto &raw = data.data;
              if (raw.size() < 20) continue;

              uint8_t ct_mac[6] = {0x48, 0x80, 0x27, 0x70, 0x00, 0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], ct_mac, 6) == 0) {
                  bool light_on = (raw[i+7] == 0x01);
                  int brt = (int)(raw[i+12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500-2700) * (int)(raw[i+13] / 255.0f * 100.0f) / 100;
                  uint8_t fs = raw[i+16];
                  bool fan_run = (fs & 0x01) != 0;
                  int fan_spd = fan_run ? (raw[i+17] + 1) : 0;

                  static bool ll=false, lfr=false; static int lb=-1, lc=-1, lfs=-1;
                  static uint32_t lr=0, lch=0; static uint8_t rc=0;
                  bool ch=(light_on!=ll)||(brt!=lb)||(ct_k!=lc)||(fan_run!=lfr)||(fan_spd!=lfs);
                  if(ch){lch=millis();rc=0;ll=light_on;lb=brt;lc=ct_k;lfr=fan_run;lfs=fan_spd;}
                  bool hb=(millis()-lr>60000);
                  bool rt=(millis()-lch<10000)&&(rc<3)&&(millis()-lr>3000);
                  if(ch||hb||rt){
                    if(rt)rc++;else rc=0; lr=millis();
                    if(light_on) id(bemfa).publish("ctlight002/up","on#"+std::to_string(brt)+"#"+std::to_string(ct_k));
                    else id(bemfa).publish("ctlight002/up","off");
                    if(fan_run) id(bemfa).publish("ctfan003/up","on#"+std::to_string(fan_spd));
                    else id(bemfa).publish("ctfan003/up","off");
                    id(ct_light_st).publish_state(light_on);
                    id(ct_brt_s).publish_state(brt);
                    id(ct_ct_s).publish_state(ct_k);
                    id(ct_fan_st).publish_state(fan_run);
                    id(ct_spd_s).publish_state(fan_spd);
                    id(ct_light_sw).publish_state(light_on);
                    id(ct_fan_sw).publish_state(fan_run);
                    // 🔥 同步原生 light/fan 组件状态
                    auto lc = id(ct_light).make_call();
                    lc.set_state(light_on);
                    if(light_on) {
                      lc.set_brightness(brt/100.0f);
                      lc.set_color_temperature(1000000.0f/ct_k);
                    }
                    lc.perform();
                    auto fc = id(ct_fan).make_call();
                    fc.set_state(fan_run);
                    if(fan_run) fc.set_speed(fan_spd);
                    fc.perform();
                  }
                  break;
                }
              }

              uint8_t cw_mac[6] = {0xF0, 0xCF, 0x2D, 0x70, 0x00, 0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], cw_mac, 6) == 0) {
                  bool light_on = (raw[i+7] == 0x01);
                  int brt = (int)(raw[i+12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500-2700) * (int)(raw[i+13] / 255.0f * 100.0f) / 100;
                  uint8_t fs = raw[i+16];
                  bool fan_run = (fs & 0x01) != 0;
                  int fan_spd = fan_run ? (raw[i+17] + 1) : 0;

                  static bool ll=false, lfr=false; static int lb=-1, lc=-1, lfs=-1;
                  static uint32_t lr=0, lch=0; static uint8_t rc=0;
                  bool ch=(light_on!=ll)||(brt!=lb)||(ct_k!=lc)||(fan_run!=lfr)||(fan_spd!=lfs);
                  if(ch){lch=millis();rc=0;ll=light_on;lb=brt;lc=ct_k;lfr=fan_run;lfs=fan_spd;}
                  bool hb=(millis()-lr>60000);
                  bool rt=(millis()-lch<10000)&&(rc<3)&&(millis()-lr>3000);
                  if(ch||hb||rt){
                    if(rt)rc++;else rc=0; lr=millis();
                    if(light_on) id(bemfa).publish("cwlight002/up","on#"+std::to_string(brt)+"#"+std::to_string(ct_k));
                    else id(bemfa).publish("cwlight002/up","off");
                    if(fan_run) id(bemfa).publish("cwfan003/up","on#"+std::to_string(fan_spd));
                    else id(bemfa).publish("cwfan003/up","off");
                    id(cw_light_st).publish_state(light_on);
                    id(cw_brt_s).publish_state(brt);
                    id(cw_ct_s).publish_state(ct_k);
                    id(cw_fan_st).publish_state(fan_run);
                    id(cw_spd_s).publish_state(fan_spd);
                    id(cw_light_sw).publish_state(light_on);
                    id(cw_fan_sw).publish_state(fan_run);
                    // 🔥 同步原生 light/fan 组件状态
                    auto lc = id(cw_light).make_call();
                    lc.set_state(light_on);
                    if(light_on) {
                      lc.set_brightness(brt/100.0f);
                      lc.set_color_temperature(1000000.0f/ct_k);
                    }
                    lc.perform();
                    auto fc = id(cw_fan).make_call();
                    fc.set_state(fan_run);
                    if(fan_run) fc.set_speed(fan_spd);
                    fc.perform();
                  }
                  break;
                }
              }
            }

# ===================== 原生 Light 组件 =====================
light:
  - platform: template
    name: "Dining Light 餐厅灯"
    id: ct_light
    color_temperature: true
    brightness: true
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          auto vals = id(ct_light).remote_values;
          int brt_pct = std::round(vals.get_brightness() * 100.0f);
          int ct_k = std::round(1000000.0f / vals.get_color_temperature());
          uint8_t bv = midea_pct_to_val(brt_pct);
          uint8_t tv = midea_kelvin_to_val(ct_k);
          id(tx).send_hex(midea_build_cmd("488027700000", {0x5B, bv, tv}, 2, 4));
    turn_off_action:
      - lambda: |-
          id(tx).send_hex(midea_build_cmd("488027700000", {0x06}, 2, 4));

  - platform: template
    name: "Bedroom Light 次卧灯"
    id: cw_light
    color_temperature: true
    brightness: true
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          auto vals = id(cw_light).remote_values;
          int brt_pct = std::round(vals.get_brightness() * 100.0f);
          int ct_k = std::round(1000000.0f / vals.get_color_temperature());
          uint8_t bv = midea_pct_to_val(brt_pct);
          uint8_t tv = midea_kelvin_to_val(ct_k);
          id(tx).send_hex(midea_build_cmd("F0CF2D700000", {0x5B, bv, tv}, 2, 4));
    turn_off_action:
      - lambda: |-
          id(tx).send_hex(midea_build_cmd("F0CF2D700000", {0x06}, 2, 4));

# ===================== 原生 Fan 组件 =====================
fan:
  - platform: template
    name: "Dining Fan 餐厅风扇"
    id: ct_fan
    speed_count: 6
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          int spd = id(ct_fan).speed;
          if(spd == 0) spd = 1;
          uint8_t cmd; int cf, ef;
          midea_fan_params(spd, cmd, cf, ef);
          id(tx).send_hex(midea_build_cmd("488027700000", {cmd}, cf, ef));
    turn_off_action:
      - lambda: |-
          id(tx).send_hex(midea_build_cmd("488027700000", {0x09}, 8, 15));
    on_speed_set:
      - lambda: |-
          int spd = id(ct_fan).speed;
          uint8_t cmd; int cf, ef;
          midea_fan_params(spd, cmd, cf, ef);
          id(tx).send_hex(midea_build_cmd("488027700000", {cmd}, cf, ef));

  - platform: template
    name: "Bedroom Fan 次卧风扇"
    id: cw_fan
    speed_count: 6
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          int spd = id(cw_fan).speed;
          if(spd == 0) spd = 1;
          uint8_t cmd; int cf, ef;
          midea_fan_params(spd, cmd, cf, ef);
          id(tx).send_hex(midea_build_cmd("F0CF2D700000", {cmd}, cf, ef));
    turn_off_action:
      - lambda: |-
          id(tx).send_hex(midea_build_cmd("F0CF2D700000", {0x09}, 8, 15));
    on_speed_set:
      - lambda: |-
          int spd = id(cw_fan).speed;
          uint8_t cmd; int cf, ef;
          midea_fan_params(spd, cmd, cf, ef);
          id(tx).send_hex(midea_build_cmd("F0CF2D700000", {cmd}, cf, ef));

