    name: "Dining Fan"
    id: ct_fan
    icon: mdi:fan
    speed_count: 6
    on_state:
      then:
        - lambda: |-
            MideaController ctrl("488027700000");
            if (id(ct_fan).state) {
              id(tx).send_hex(ctrl.make_command({0x09}, 8, 15));
