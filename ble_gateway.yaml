# ===================== Number 滑块 =====================
number:
  - platform: template
    name: "Dining Brightness"
    id: ct_brt_n
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-percent
    set_action:
      - lambda: |-
          g_devices[0].brightness = (int)x;
          ble_queue_add(g_devices[0].cmd_brightness((int)x), 0);
          id(ct_brt).publish_state((int)x);
          id(ct_light_on).publish_state(true);
          id(ct_light_sw).publish_state(true);

  - platform: template
    name: "Dining ColorTemp"
    id: ct_ct_n
    min_value: 2700
    max_value: 6500
    step: 100
    unit_of_measurement: "K"
    icon: mdi:thermometer
