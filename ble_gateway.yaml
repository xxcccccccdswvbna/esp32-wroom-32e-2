          ble_queue_add(g_devices[3].cmd_color_temp((int)x), 0);
          id(kkt_ct).publish_state((int)x);
  - platform: template
    name: "Living Room Fan Speed"
    id: kkt_spd_n
    min_value: 1
    max_value: 6
    step: 1
    icon: mdi:fan-speed-1
    set_action:
      - lambda: |-
          g_devices[3].fan_speed = (int)x;
          g_devices[3].fan_on = true;
          ble_queue_add(g_devices[3].cmd_fan_on(), 0);
          id(kkt_spd).publish_state((int)x);
          id(kkt_fan_on).publish_state(true);
          id(kkt_fan_sw).publish_state(true);

