# ===================== 传感器 =====================
sensor:
  - platform: template
    name: "Dining Brt"
    id: ct_brt
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dining CT"
    id: ct_ct
    unit_of_measurement: "K"
  - platform: template
    name: "Dining Spd"
    id: ct_spd
  - platform: template
    name: "Bedroom Brt"
    id: cw_brt
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Bedroom CT"
    id: cw_ct
    unit_of_measurement: "K"
  - platform: template
    name: "Bedroom Spd"
    id: cw_spd
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: internal_temperature
    name: "ESP32 Temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi dBm"
    id: wifi_signal_db
    update_interval: 60s
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Pct"
    filters:
      - lambda: return min(max(2*(x+100.0),0.0),100.0);
    unit_of_measurement: "%"
    accuracy_decimals: 0

binary_sensor:
  - platform: status
    name: "Gateway Online"
    device_class: connectivity
  - platform: template
    name: "Dining Light On"
    id: ct_light_on
    device_class: light
  - platform: template
    name: "Dining Fan On"
    id: ct_fan_on
    device_class: running
  - platform: template
    name: "Bedroom Light On"
    id: cw_light_on
    device_class: light
  - platform: template
    name: "Bedroom Fan On"
    id: cw_fan_on
    device_class: running

text_sensor:
  - platform: template
    name: "Build Time"
    lambda: 'return {"${build_time}"};'
    update_interval: 3600s
  - platform: version
    name: "ESPHome Ver"
    hide_timestamp: true
  - platform: wifi_info
    ip_address:
      name: "ESP IP"
    ssid:
      name: "ESP SSID"

button:
  - platform: restart
    name: "Restart GW"
    icon: mdi:restart
    entity_category: diagnostic
