# ===================== BLE 扫描与状态上报 (智能节流 + 双向同步) =====================
esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            auto datas = x.get_manufacturer_datas();
            for (auto &data : datas) {
              auto &raw = data.data;
              if (raw.size() < 20) continue;

              // ===== Dining 餐厅设备 =====
              uint8_t ct_mac[6] = {0x48, 0x80, 0x27, 0x70, 0x00, 0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], ct_mac, 6) == 0) {
                  bool light_on = (raw[i + 7] == 0x01);
                  int brt = (int)(raw[i + 12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500 - 2700) * (int)(raw[i + 13] / 255.0f * 100.0f) / 100;
                  uint8_t fan_state = raw[i + 16];
                  bool fan_run = (fan_state & 0x01) != 0; 
                  int fan_spd = fan_run ? (raw[i + 17] + 1) : 0;

                  static bool last_light = false, last_fan_run = false;
                  static int last_brt = -1, last_ct = -1, last_fan_spd = -1;
                  static uint32_t last_report = 0, last_change = 0;
                  static uint8_t retry_count = 0;

                  bool changed = (light_on != last_light) || (brt != last_brt) || (ct_k != last_ct) || (fan_run != last_fan_run) || (fan_spd != last_fan_spd);
                  if (changed) { last_change = millis(); retry_count = 0; last_light = light_on; last_brt = brt; last_ct = ct_k; last_fan_run = fan_run; last_fan_spd = fan_spd; }
                  bool heartbeat = (millis() - last_report > 60000);
                  bool retry = (millis() - last_change < 10000) && (retry_count < 3) && (millis() - last_report > 3000);

                  if (changed || heartbeat || retry) {
                    if (retry) retry_count++; else retry_count = 0;
                    last_report = millis();
                    
                    // 1. 上报给巴法云
                    if (light_on) id(bemfa).publish("ctlight002/up", "on#" + std::to_string(brt) + "#" + std::to_string(ct_k));
                    else id(bemfa).publish("ctlight002/up", "off");
                    if (fan_run) id(bemfa).publish("ctfan003/up", "on#" + std::to_string(fan_spd));
                    else id(bemfa).publish("ctfan003/up", "off");

                    // 2. 反向同步给 HA 原生 Light 组件
                    auto light_call = id(ct_light).make_call();
                    light_call.set_state(light_on);
                    if (light_on) { light_call.set_brightness(brt / 100.0f); light_call.set_color_temperature(1000000.0f / ct_k); }
                    light_call.perform();

                    // 3. 反向同步给 HA 原生 Fan 组件
                    auto fan_call = id(ct_fan).make_call();
                    fan_call.set_state(fan_run);
                    if (fan_run) fan_call.set_speed(fan_spd);
                    fan_call.perform();
                  }
                  break;
                }
              }

              // ===== Bedroom 次卧设备 =====
              uint8_t cw_mac[6] = {0xF0, 0xCF, 0x2D, 0x70, 0x00, 0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], cw_mac, 6) == 0) {
                  bool light_on = (raw[i + 7] == 0x01);
                  int brt = (int)(raw[i + 12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500 - 2700) * (int)(raw[i + 13] / 255.0f * 100.0f) / 100;
                  uint8_t fan_state = raw[i + 16];
                  bool fan_run = (fan_state & 0x01) != 0;
                  int fan_spd = fan_run ? (raw[i + 17] + 1) : 0;

                  static bool last_light = false, last_fan_run = false;
                  static int last_brt = -1, last_ct = -1, last_fan_spd = -1;
                  static uint32_t last_report = 0, last_change = 0;
                  static uint8_t retry_count = 0;

                  bool changed = (light_on != last_light) || (brt != last_brt) || (ct_k != last_ct) || (fan_run != last_fan_run) || (fan_spd != last_fan_spd);
                  if (changed) { last_change = millis(); retry_count = 0; last_light = light_on; last_brt = brt; last_ct = ct_k; last_fan_run = fan_run; last_fan_spd = fan_spd; }
                  bool heartbeat = (millis() - last_report > 60000);
                  bool retry = (millis() - last_change < 10000) && (retry_count < 3) && (millis() - last_report > 3000);

                  if (changed || heartbeat || retry) {
                    if (retry) retry_count++; else retry_count = 0;
                    last_report = millis();
                    
                    // 1. 上报给巴法云
                    if (light_on) id(bemfa).publish("cwlight002/up", "on#" + std::to_string(brt) + "#" + std::to_string(ct_k));
                    else id(bemfa).publish("cwlight002/up", "off");
                    if (fan_run) id(bemfa).publish("cwfan003/up", "on#" + std::to_string(fan_spd));
                    else id(bemfa).publish("cwfan003/up", "off");

                    // 2. 反向同步给 HA 原生 Light 组件
                    auto light_call = id(cw_light).make_call();
                    light_call.set_state(light_on);
                    if (light_on) { light_call.set_brightness(brt / 100.0f); light_call.set_color_temperature(1000000.0f / ct_k); }
                    light_call.perform();

                    // 3. 反向同步给 HA 原生 Fan 组件
                    auto fan_call = id(cw_fan).make_call();
                    fan_call.set_state(fan_run);
                    if (fan_run) fan_call.set_speed(fan_spd);
                    fan_call.perform();
                  }
                  break;
                }
              }
            }

# ===================== 原生灯光组件 (HA 完美支持亮度/色温) =====================
