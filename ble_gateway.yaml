substitutions:
  project_name: "byy1"
  build_time: "Unknown"

esphome:
  name: ble-2
  friendly_name: "${project_name}"
  comment: "${project_name} - Build: ${build_time}"
  includes:
    - midea_ble_controller.h

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: y

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: "CC"
  password: "chen1122"
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "BLE-GW Fallback"
    password: "12345678"

captive_portal:
web_server:
  port: 80
ota:
  - platform: esphome
api:
  reboot_timeout: 0s
  services:
    - service: send_raw_hex
      variables:
        hex_data: string
      then:
        - lambda: 'id(tx).send_hex(hex_data);'

external_components:
  - source:
      type: local
      path: components

ble_tx:
  id: tx

esp32_ble:
  io_capability: none
  enable_on_boot: true

bluetooth_proxy:
  active: true
  cache_services: true

globals:
  - id: dining_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'
  - id: bedroom_ct_kelvin
    type: int
    restore_value: no
    initial_value: '4600'

mqtt:
  id: bemfa
  broker: bemfa.com
  port: 9501
  username: "97109945d7e24559b3e4ca7a1f8ef160"
  password: "97109945d7e24559b3e4ca7a1f8ef160"
  client_id: "97109945d7e24559b3e4ca7a1f8ef160"
  keepalive: 30s
  discovery: false
  birth_message:
  will_message:
  on_message:
    - topic: "ctlight002"
      then:
        - lambda: |-
            std::string cmd;
            if(x == "on"){
              int ct = id(dining_ct_kelvin);
              int brt = id(dining_brt).state;
              if(brt < 1) brt = 50;
              cmd = midea_light_on("488027700000", brt, ct);
              id(dining_light_on).publish_state(true);
            }else if(x == "off"){
              cmd = midea_light_off("488027700000");
              id(dining_light_on).publish_state(false);
            }else if(x.find("on#") == 0){
              std::string rest = x.substr(3);
              size_t pos = rest.find('#');
              int brt = std::stoi(rest.substr(0, pos));
              int ct = id(dining_ct_kelvin);
              if(pos != std::string::npos){
                std::string ct_str = rest.substr(pos+1);
                if(!ct_str.empty()){
                  int val = std::stoi(ct_str);
                  if(val >= 2700 && val <= 6500){
                    ct = val;
                    id(dining_ct_kelvin) = ct;
                  }
                }
              }
              cmd = midea_light_on("488027700000", brt, ct);
              id(dining_light_on).publish_state(true);
            }
            id(tx).send_hex(cmd);

    - topic: "ctfan003"
      then:
        - lambda: |-
            std::string cmd;
            if(x == "on"){
              int spd = id(dining_spd).state;
              if(spd < 1) spd = 1;
              cmd = midea_fan_on("488027700000", spd);
              id(dining_fan_on).publish_state(true);
            }else if(x == "off"){
              cmd = midea_fan_off("488027700000");
              id(dining_fan_on).publish_state(false);
            }else if(x.find("on#") == 0){
              int s = std::stoi(x.substr(3));
              cmd = midea_fan_on("488027700000", s);
              id(dining_fan_on).publish_state(true);
            }
            id(tx).send_hex(cmd);

    - topic: "cwlight002"
      then:
        - lambda: |-
            std::string cmd;
            if(x == "on"){
              int ct = id(bedroom_ct_kelvin);
              int brt = id(bedroom_brt).state;
              if(brt < 1) brt = 50;
              cmd = midea_light_on("F0CF2D700000", brt, ct);
              id(bedroom_light_on).publish_state(true);
            }else if(x == "off"){
              cmd = midea_light_off("F0CF2D700000");
              id(bedroom_light_on).publish_state(false);
            }else if(x.find("on#") == 0){
              std::string rest = x.substr(3);
              size_t pos = rest.find('#');
              int brt = std::stoi(rest.substr(0, pos));
              int ct = id(bedroom_ct_kelvin);
              if(pos != std::string::npos){
                std::string ct_str = rest.substr(pos+1);
                if(!ct_str.empty()){
                  int val = std::stoi(ct_str);
                  if(val >= 2700 && val <= 6500){
                    ct = val;
                    id(bedroom_ct_kelvin) = ct;
                  }
                }
              }
              cmd = midea_light_on("F0CF2D700000", brt, ct);
              id(bedroom_light_on).publish_state(true);
            }
            id(tx).send_hex(cmd);

    - topic: "cwfan003"
      then:
        - lambda: |-
            std::string cmd;
            if(x == "on"){
              int spd = id(bedroom_spd).state;
              if(spd < 1) spd = 1;
              cmd = midea_fan_on("F0CF2D700000", spd);
              id(bedroom_fan_on).publish_state(true);
            }else if(x == "off"){
              cmd = midea_fan_off("F0CF2D700000");
              id(bedroom_fan_on).publish_state(false);
            }else if(x.find("on#") == 0){
              int s = std::stoi(x.substr(3));
              cmd = midea_fan_on("F0CF2D700000", s);
              id(bedroom_fan_on).publish_state(true);
            }
            id(tx).send_hex(cmd);

esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 30ms
    active: false
  on_ble_advertise:
    - then:
        - lambda: |-
            auto datas = x.get_manufacturer_datas();
            for (auto &data : datas) {
              auto &raw = data.data;
              if (raw.size() < 20) continue;
              uint8_t dining_mac[6] = {0x48,0x80,0x27,0x70,0x00,0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], dining_mac, 6) == 0) {
                  bool light_on = (raw[i+7] == 0x01);
                  int brt = (int)(raw[i+12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500-2700) * (int)(raw[i+13] / 255.0f * 100.0f) / 100;
                  uint8_t fan_state = raw[i+16];
                  bool fan_run = (fan_state & 0x01) != 0;
                  int fan_spd = fan_run ? (raw[i+17] + 1) : 0;

                  static bool dining_ll = false, dining_lfr = false;
                  static int dining_lb = -1, dining_lc = -1, dining_lfs = -1;
                  static uint32_t dining_lr = 0, dining_lch = 0;
                  static uint8_t dining_rc = 0;
                  bool changed = (light_on!=dining_ll) || (brt!=dining_lb) || (ct_k!=dining_lc) || (fan_run!=dining_lfr) || (fan_spd!=dining_lfs);
                  if(changed){
                    dining_lch = millis();
                    dining_rc = 0;
                    dining_ll = light_on; dining_lb = brt; dining_lc = ct_k; dining_lfr = fan_run; dining_lfs = fan_spd;
                  }
                  bool heartbeat = (millis() - dining_lr > 60000);
                  bool retry = (millis() - dining_lch < 10000) && (dining_rc < 3) && (millis() - dining_lr > 3000);
                  if(changed || heartbeat || retry){
                    if(retry) dining_rc++; else dining_rc = 0;
                    dining_lr = millis();
                    if(light_on) id(bemfa).publish("ctlight002/up","on#"+std::to_string(brt)+"#"+std::to_string(ct_k));
                    else id(bemfa).publish("ctlight002/up","off");
                    if(fan_run) id(bemfa).publish("ctfan003/up","on#"+std::to_string(fan_spd));
                    else id(bemfa).publish("ctfan003/up","off");
                    id(dining_light_on).publish_state(light_on);
                    id(dining_brt).publish_state(brt);
                    id(dining_ct).publish_state(ct_k);
                    id(dining_fan_on).publish_state(fan_run);
                    id(dining_spd).publish_state(fan_spd);
                  }
                  break;
                }
              }
              uint8_t bedroom_mac[6] = {0xF0,0xCF,0x2D,0x70,0x00,0x00};
              for (int i = 2; i <= (int)raw.size() - 6; i++) {
                if (memcmp(&raw[i], bedroom_mac, 6) == 0) {
                  bool light_on = (raw[i+7] == 0x01);
                  int brt = (int)(raw[i+12] / 255.0f * 100.0f);
                  int ct_k = 2700 + (6500-2700) * (int)(raw[i+13] / 255.0f * 100.0f) / 100;
                  uint8_t fan_state = raw[i+16];
                  bool fan_run = (fan_state & 0x01) != 0;
                  int fan_spd = fan_run ? (raw[i+17] + 1) : 0;

                  static bool bedroom_ll = false, bedroom_lfr = false;
                  static int bedroom_lb = -1, bedroom_lc = -1, bedroom_lfs = -1;
                  static uint32_t bedroom_lr = 0, bedroom_lch = 0;
                  static uint8_t bedroom_rc = 0;
                  bool changed = (light_on!=bedroom_ll) || (brt!=bedroom_lb) || (ct_k!=bedroom_lc) || (fan_run!=bedroom_lfr) || (fan_spd!=bedroom_lfs);
                  if(changed){
                    bedroom_lch = millis();
                    bedroom_rc = 0;
                    bedroom_ll = light_on; bedroom_lb = brt; bedroom_lc = ct_k; bedroom_lfr = fan_run; bedroom_lfs = fan_spd;
                  }
                  bool heartbeat = (millis() - bedroom_lr > 60000);
                  bool retry = (millis() - bedroom_lch < 10000) && (bedroom_rc < 3) && (millis() - bedroom_lr > 3000);
                  if(changed || heartbeat || retry){
                    if(retry) bedroom_rc++; else bedroom_rc = 0;
                    bedroom_lr = millis();
                    if(light_on) id(bemfa).publish("cwlight002/up","on#"+std::to_string(brt)+"#"+std::to_string(ct_k));
                    else id(bemfa).publish("cwlight002/up","off");
                    if(fan_run) id(bemfa).publish("cwfan003/up","on#"+std::to_string(fan_spd));
                    else id(bemfa).publish("cwfan003/up","off");
                    id(bedroom_light_on).publish_state(light_on);
                    id(bedroom_brt).publish_state(brt);
                    id(bedroom_ct).publish_state(ct_k);
                    id(bedroom_fan_on).publish_state(fan_run);
                    id(bedroom_spd).publish_state(fan_spd);
                  }
                  break;
                }
              }
            }

light:
  - platform: midea_light
    name: "Dining Light"
    id: dining_light
    mac: "488027700000"
    icon: mdi:ceiling-light
  - platform: midea_light
    name: "Bedroom Light"
    id: bedroom_light
    mac: "F0CF2D700000"
    icon: mdi:ceiling-light

fan:
  - platform: midea_fan
    name: "Dining Fan"
    id: dining_fan
    mac: "488027700000"
    icon: mdi:fan
  - platform: midea_fan
    name: "Bedroom Fan"
    id: bedroom_fan
    mac: "F0CF2D700000"
    icon: mdi:fan

sensor:
  - platform: template
    name: "Dining Brt"
    id: dining_brt
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dining CT"
    id: dining_ct
    unit_of_measurement: "K"
  - platform: template
    name: "Dining Spd"
    id: dining_spd
  - platform: template
    name: "Bedroom Brt"
    id: bedroom_brt
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Bedroom CT"
    id: bedroom_ct
    unit_of_measurement: "K"
  - platform: template
    name: "Bedroom Spd"
    id: bedroom_spd
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: internal_temperature
    name: "ESP32 Temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi dBm"
    id: wifi_signal_db
    update_interval: 60s
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Pct"
    filters:
      - lambda: return min(max(2*(x+100.0),0.0),100.0);
    unit_of_measurement: "%"
    accuracy_decimals: 0

binary_sensor:
  - platform: template
    name: "Dining Light On"
    id: dining_light_on
    device_class: light
  - platform: template
    name: "Dining Fan On"
    id: dining_fan_on
    device_class: running
  - platform: template
    name: "Bedroom Light On"
    id: bedroom_light_on
    device_class: light
  - platform: template
    name: "Bedroom Fan On"
    id: bedroom_fan_on
    device_class: running
  - platform: status
    name: "Gateway Online"
    device_class: connectivity

text_sensor:
  - platform: template
    name: "Build Time"
    lambda: 'return {"${build_time}"};'
    update_interval: 3600s
  - platform: version
    name: "ESPHome Ver"
    hide_timestamp: true
  - platform: wifi_info
    ip_address:
      name: "ESP IP"
    ssid:
      name: "ESP SSID"

button:
  - platform: restart
    name: "Restart GW"
    icon: mdi:restart
    entity_category: diagnostic
